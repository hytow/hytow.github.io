"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "37", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉记忆", "s": "我们家刷墙用了三天，铺地板用了五天，装橱柜又用了两天，一共忙了十天，那十天住在奶奶家。", "qa": [["刷墙用了几天？", "三天"], ["铺地板用了几天？", "五天"], ["一共忙了几天？", "十天"], ["住在哪里？", "奶奶家"]], "h": "三个数字加一个合计，答对两个就很不错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "38", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "客人来了，妈妈请他坐沙发、倒茶，最后端出一盘切好的苹果。客人只喝了茶，苹果一块也没动。", "qa": [["先请客人做什么？", "坐沙发"], ["倒了什么？", "茶"], ["最后端出什么？", "苹果"], ["客人吃了苹果吗？", "一块没动"]], "h": "最后一问是转折，注意他有没有听全。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "39", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "我不小心把杯子摔了，碎成三块，水洒了一地。我先用抹布擦水，再用扫帚把碎片扫进簸箕。", "qa": [["摔了什么？", "杯子"], ["碎成几块？", "三块"], ["先用什么擦水？", "抹布"], ["碎片扫进哪里？", "簸箕"]], "h": "抹布、扫帚、簸箕三样工具，是本档考点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "40", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "爷爷的椅子只有三条腿，一坐就晃。他找了块小木片垫在短腿下面，又用钉子钉紧，椅子就稳了。", "qa": [["椅子有几条腿？", "三条"], ["为什么会晃？", "少一条腿"], ["垫了什么？", "一块小木片"], ["怎么固定的？", "用钉子钉紧"]], "h": "「垫木片」加「钉钉子」是两步。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "41", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "站在太阳下面，地上会有我的影子。我往前走影子跟着走，我蹲下影子变矮。中午最短，傍晚最长。", "qa": [["太阳下地上有什么？", "我的影子"], ["我往前走影子怎么样？", "跟着走"], ["什么时候影子最短？", "中午"], ["什么时候影子最长？", "傍晚"]], "h": "两个时间点对比，是这题的核心。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "42", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "我发烧了，妈妈用体温计夹在我腋下，量出来三十八度五。她说超过三十七度就算发烧。", "qa": [["用什么量体温？", "体温计"], ["夹在哪里？", "腋下"], ["量出多少度？", "三十八度五"], ["超过多少度算发烧？", "三十七度"]], "h": "两个数字，是本档的难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "43", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "我摔了一跤，膝盖先流血，妈妈用清水冲干净，涂上药水，贴上创可贴，过了五天结痂就好了。", "qa": [["膝盖先怎么样？", "流血"], ["妈妈用什么冲？", "清水"], ["贴上什么？", "创可贴"], ["过几天怎么样？", "结痂、好了"]], "h": "伤—处理—痊愈，时间顺序很清楚。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "44", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "我吃饭太快打了个嗝。奶奶让我喝几口温水慢慢咽，过一会儿就不打了。她说下次要细嚼慢咽。", "qa": [["我为什么打嗝？", "吃饭太快"], ["奶奶让我喝什么？", "温水"], ["要怎么咽？", "慢慢咽"], ["以后要怎么吃？", "细嚼慢咽"]], "h": "最后一问是「以后」，考他有没有听完最后一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "45", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉记忆", "s": "我六岁，一米一八；爸爸一米七五，妈妈一米六二。奶奶说我每年长五六厘米，上初中就能赶上妈妈。", "qa": [["我多高？", "一米一八"], ["爸爸多高？", "一米七五"], ["妈妈多高？", "一米六二"], ["我每年长多少？", "五六厘米"]], "h": "三个身高加一个速度，答对两个就不错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "46", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "我看黑板有点模糊，妈妈带我去查眼睛。医生让我看视力表，用手指着方向，查完说我近视了，要配眼镜。", "qa": [["什么看得有点模糊？", "黑板"], ["医生让我看什么？", "视力表"], ["查出来怎么样？", "近视了"], ["最后要做什么？", "配眼镜"]], "h": "可以让他回忆一下自己有没有查过眼睛。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "47", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "我睡着以后，身体还在干活：呼吸变慢，心跳也慢下来但没停；眼睛闭着会做梦；天一亮我自己就醒了。", "qa": [["睡着后呼吸怎么样？", "变慢"], ["心跳停了吗？", "没有，还在跳"], ["眼睛闭着会做什么？", "做梦"], ["什么时候自己醒？", "天亮"]], "h": "「心跳没停」是这题的反直觉点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "48", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "指甲长了要剪。妈妈先用温水给我泡手，再用指甲刀一个一个剪，最后用磨砂条把边磨平。", "qa": [["先做什么？", "用温水泡手"], ["用什么剪？", "指甲刀"], ["怎么剪？", "一个一个剪"], ["最后做什么？", "把边磨平"]], "h": "三步加方式，是身体类的基础题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "49", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "打针的时候，护士先用棉签擦一擦胳膊，再很快扎进去，推完药拔出来，最后贴一小块胶布，说别马上洗澡。", "qa": [["先用什么擦胳膊？", "棉签"], ["扎在哪里？", "胳膊"], ["最后贴什么？", "一小块胶布"], ["她说了什么？", "别马上洗澡"]], "h": "最后一句常被忽略，注意他记不记得。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "50", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "照镜子的时候我举右手，镜子里举的却是左手。妈妈说镜子是反的，所以镜子里的字也是反的。", "qa": [["我举右手镜子举哪只？", "左手"], ["为什么会这样？", "镜子是反的"], ["谁告诉我原因？", "妈妈"], ["镜子里的字是怎样的？", "反的"]], "h": "从动作推到文字，是这题的延伸。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "51", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "下雨前有几个信号：燕子飞得很低，因为虫子翅膀潮了飞不高；蚂蚁把家搬到高处；墙面摸上去潮潮的。", "qa": [["下雨前燕子飞得高还是低？", "低"], ["为什么飞得低？", "虫子翅膀潮了飞不高"], ["蚂蚁在做什么？", "把家搬到高处"], ["墙面摸上去怎么样？", "潮潮的"]], "h": "这是「观察—推断」，答出两个信号就已经很好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "52", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉记忆", "s": "一年有四季：春天暖和，夏天炎热，秋天凉快，冬天寒冷。我们这里四季分明，每一季大约三个月。", "qa": [["一年有几个季节？", "四个"], ["哪个季节最热？", "夏天"], ["哪个季节凉快？", "秋天"], ["每季大约多长？", "三个月"]], "h": "四季加特征，答对三个就算过关。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "53", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉顺序", "s": "太阳早上从东边升起来，中午升到最高，下午往西边落，傍晚落到地平线下面。所以影子早上在西边。", "qa": [["太阳从哪边升起来？", "东边"], ["什么时候最高？", "中午"], ["下午往哪边落？", "西边"], ["早上的影子在哪边？", "西边"]], "h": "方位加时间，是三星里较难的一类。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "54", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "下雪的时候其实不那么冷，雪化了才最冷。爷爷说，雪化的时候要把周围的热吸走，所以人觉得更冷。", "qa": [["什么时候不那么冷？", "下雪的时候"], ["什么时候最冷？", "雪化的时候"], ["雪化会吸走什么？", "热"], ["谁说的这个道理？", "爷爷"]], "h": "反常识题，答对前两问就已经很好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "55", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "地球一直在转。转到太阳照到我们这一面就是白天，转到背对太阳就是黑夜。所以我们天亮时，别处可能正黑着。", "qa": [["地球一直在做什么？", "转"], ["照到太阳是白天还是黑夜？", "白天"], ["背对太阳是什么时候？", "黑夜"], ["我们天亮时别处一定也亮吗？", "不一定"]], "h": "超出学前认知，能记住「地球在转」就够了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "56", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉顺序", "s": "水被太阳晒热变成水汽飘到天上，遇到冷空气聚成小水珠就成了云；水珠越聚越重，落下来就是雨。", "qa": [["水被晒热变成什么？", "水汽"], ["水汽飘到哪里？", "天上"], ["遇冷聚成什么？", "小水珠"], ["小水珠落下来是什么？", "雨"]], "h": "水循环四步，是全档最抽象的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "57", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "冬天河面结了冰，看起来是硬的，其实很薄。爷爷说不能上去踩，冰一裂，人就掉下去了。", "qa": [["冬天河面怎么样？", "结了冰"], ["冰看起来硬，其实呢？", "很薄"], ["爷爷说不能做什么？", "上去踩"], ["踩了会怎么样？", "冰裂掉下去"]], "h": "安全题，答对要郑重说一句「记住这个」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "58", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "夏天的晚上，草丛里有一闪一闪的小光点，那是萤火虫。它的尾巴会发光，天一凉就看不见了。", "qa": [["萤火虫什么时候出现？", "夏天的晚上"], ["哪里一闪一闪？", "草丛里"], ["它哪里会发光？", "尾巴"], ["天凉了会怎么样？", "看不见了"]], "h": "「尾巴发光」是知识点，答出来要夸。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "59", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "台风来的时候风很大，雨是横着飞的。电视里说要关好窗户、把阳台花盆搬进来，还不能出门。", "qa": [["台风来时风怎么样？", "很大"], ["雨是怎么飞的？", "横着飞"], ["阳台花盆要怎么办？", "搬进来"], ["能不能出门？", "不能"]], "h": "三条指令，答对两条就算听到了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "60", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉顺序", "s": "早上的影子在西边，因为太阳从东边升起；傍晚太阳落到西边，影子就跑到东边，还拉得很长。", "qa": [["早上的影子在哪边？", "西边"], ["傍晚影子在哪边？", "东边"], ["傍晚的影子长不长？", "很长"], ["影子为什么变方向？", "太阳换位置了"]], "h": "方向加时间，是这档的难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "61", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "喝水要排队：先拿自己的杯子，再站到队伍最后，轮到了接半杯水，喝完放回架子，最后回座位。", "qa": [["先做什么？", "拿自己的杯子"], ["站在哪里？", "队伍最后"], ["接多少水？", "半杯"], ["喝完杯子放哪里？", "架子上"]], "h": "五步指令，是本主题最长的。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "62", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "今天王老师请假，来了一位李老师。她先介绍自己姓李，然后带我们唱了一首歌，下午还教我们折纸。", "qa": [["谁请假了？", "王老师"], ["新老师姓什么？", "李"], ["她带我们做了什么？", "唱歌"], ["下午教什么？", "折纸"]], "h": "姓氏是考点，「姓李」不是「叫李」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "63", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "我刚转来时谁也不认识。第一天坐在最后一排，一个人吃饭；第二天有个女孩叫我一起玩滑梯。", "qa": [["我刚来时认识谁？", "谁也不认识"], ["第一天坐在哪里？", "最后一排"], ["第二天谁叫我玩？", "一个女孩"], ["我们一起玩什么？", "滑梯"]], "h": "时间线（第一天/第二天）是这题的关键。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "64", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "开家长会，老师先说了这学期学了什么，再讲小朋友吃饭睡觉的情况，最后请家长提意见。", "qa": [["谁去开家长会？", "妈妈"], ["老师先说什么？", "这学期学了什么"], ["再讲什么？", "吃饭睡觉的情况"], ["最后做什么？", "请家长提意见"]], "h": "三步议程，「最后」那一项最容易漏。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "65", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "收玩具时，老师说先收积木，再收拼图，然后收画笔，最后把箱子推回墙角，谁先收完谁去洗手。", "qa": [["先收什么？", "积木"], ["接着收什么？", "拼图"], ["再收什么？", "画笔"], ["箱子推到哪里？", "墙角"]], "h": "四类玩具加一条规则，答对三个算好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "66", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉理解", "s": "我带了新橡皮去幼儿园，下午不见了。我以为同桌拿的，跟他吵了一架，后来在自己书包夹层找到，道了歉。", "qa": [["什么不见了？", "新橡皮"], ["我以为是谁拿的？", "同桌"], ["后来在哪里找到？", "书包夹层"], ["最后我做了什么？", "跟他道歉"]], "h": "重点在「误会」，答出「冤枉了同桌」才算听懂。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "67", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉理解", "s": "绘本课上老师讲《好饿的毛毛虫》。讲到它吃太多肚子疼，小朋友都笑了；讲完老师问它最后变成了什么。", "qa": [["老师讲了什么书？", "好饿的毛毛虫"], ["它吃太多怎么了？", "肚子疼"], ["小朋友为什么笑？", "觉得好玩"], ["老师最后问了什么？", "它变成了什么"]], "h": "这个故事他可能听过，正好考迁移。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "68", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉记忆", "s": "六一表演，我们班跳舞。我站在第三排中间，穿黄衣服，手里拿一朵纸花，音乐一响我就有点紧张。", "qa": [["我们班表演什么？", "跳舞"], ["我站在第几排？", "第三排"], ["穿什么颜色衣服？", "黄色"], ["音乐一响我怎么样？", "有点紧张"]], "h": "最后一问是感受，容易漏，注意他记不记得。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "69", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "春游先坐大巴到公园，跟着老师看花，在草地上吃午饭，最后排队上车回幼儿园，回来时都睡着了。", "qa": [["怎么去公园？", "坐大巴"], ["到公园先做什么？", "看花"], ["在哪里吃午饭？", "草地上"], ["回来时大家怎么样？", "都睡着了"]], "h": "四步行程加一个结尾细节。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "70", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 3, "ab": "听觉顺序", "s": "我和朵朵抢积木吵了一架，积木撒了一地。后来我先道歉，她也道歉，我们一起把积木收好又搭了座桥。", "qa": [["我和谁吵架？", "朵朵"], ["为什么吵？", "抢积木"], ["谁先道歉？", "我"], ["和好以后做了什么？", "收积木、搭桥"]], "h": "最后两件事连在一起，是本档的难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "71", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉顺序", "s": "做蛋糕要先打发鸡蛋和糖，再筛进面粉拌匀，倒进模具放进烤箱烤三十分钟，放凉才能抹奶油。", "qa": [["先打发什么？", "鸡蛋和糖"], ["接着筛进什么？", "面粉"], ["要烤多久？", "三十分钟"], ["什么时候才能抹奶油？", "放凉以后"]], "h": "四步加一个时间，全对很难，三步就是优秀。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "72", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉记忆", "s": "包子刚出笼，冒着白气。我一口气吃了两个肉馅、一个菜馅。爷爷说菜馅是他包的，肉馅是奶奶包的。", "qa": [["我一共吃了几个？", "三个"], ["吃了几个肉馅？", "两个"], ["菜馅是谁包的？", "爷爷"], ["肉馅是谁包的？", "奶奶"]], "h": "「一共三个」要 2+1，先问分项再问合计。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "73", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉顺序", "s": "冬天吃火锅。汤先烧开，先下萝卜和土豆，煮一会儿再放肉片，肉一变色就能吃，最后才放青菜。", "qa": [["汤怎么样以后才下菜？", "烧开"], ["最先下什么？", "萝卜和土豆"], ["肉什么时候能吃？", "变色以后"], ["最后放什么？", "青菜"]], "h": "四个节点，是全套里最难的顺序题之一。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "74", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉顺序", "s": "年夜饭那天，奶奶先炖了一锅汤，妈妈再炒四个菜，爸爸把饺子下锅，最后爷爷端上鱼。", "qa": [["谁炖的汤？", "奶奶"], ["妈妈炒了几个菜？", "四个"], ["谁下的饺子？", "爸爸"], ["最后谁端上鱼？", "爷爷"]], "h": "四个人四个动作，最容易串的就是这题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "75", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉顺序", "s": "做汤圆：糯米粉加水揉成团，再搓成小球，按个坑放进芝麻馅，收口搓圆，最后下锅煮到浮起来。", "qa": [["糯米粉要加什么？", "水"], ["搓成什么？", "小球"], ["放进什么馅？", "芝麻馅"], ["煮到什么程度才好？", "浮起来"]], "h": "五步，是全档最长的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "76", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉顺序", "s": "妈妈照菜谱做红烧肉：五花肉切块，冷水下锅焯一下捞出，放糖炒出颜色，再加水小火炖四十分钟。", "qa": [["用什么肉？", "五花肉"], ["先下什么锅焯？", "冷水锅"], ["放什么炒出颜色？", "糖"], ["要炖多久？", "四十分钟"]], "h": "四步一个数字，答对三个就是优秀。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "77", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉理解", "s": "冰箱里的剩菜放了四天，闻起来有点酸。妈妈说放久了会长细菌，吃了会拉肚子，让我倒掉。", "qa": [["剩菜放了几天？", "四天"], ["闻起来怎么样？", "有点酸"], ["妈妈说为什么不能吃？", "长细菌了"], ["吃了会怎么样？", "拉肚子"]], "h": "健康常识题，答对了要专门肯定。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "78", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉理解", "s": "吃饭的时候爷爷先动筷子，我们才动；夹菜不能翻来翻去；嘴里有东西不要说话。妈妈说这是规矩。", "qa": [["谁先动筷子？", "爷爷"], ["夹菜不能怎么样？", "翻来翻去"], ["嘴里有东西不要做什么？", "说话"], ["妈妈说这是什么？", "规矩"]], "h": "三条规矩，答对两条就算听进去了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "79", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉记忆", "s": "我跟妈妈去买菜，买了三根茄子、一斤豆角、两条鱼，一共花了三十二块。回家路上我拎着最轻的豆角。", "qa": [["买了几根茄子？", "三根"], ["买了几条鱼？", "两条"], ["一共花了多少钱？", "三十二块"], ["我拎的是哪一袋？", "豆角"]], "h": "三样东西、一个总价、一个细节，是综合题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "80", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 3, "ab": "听觉理解", "s": "糖是甜的，吃多了牙疼。妈妈一天只让我吃一颗，吃完要漱口。我把糖纸收在口袋里，攒了五张。", "qa": [["糖是什么味道？", "甜的"], ["吃多了会怎么样？", "牙疼"], ["一天能吃几颗？", "一颗"], ["我攒了几张糖纸？", "五张"]], "h": "适合当「讲道理」的引子，但别讲太久。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "81", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "种一颗种子要有土、有水、有太阳。把种子埋进土里浇透水，放在有光的地方，它先长根再冒芽。", "qa": [["需要哪三样？", "土、水、太阳"], ["先做什么？", "埋进土里浇水"], ["发芽前先长出什么？", "根"], ["根长在哪里？", "土里"]], "h": "「先长根再长芽」是反直觉的点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "82", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉理解", "s": "一棵树四季不一样：春天发芽，夏天叶子最密，秋天叶子变黄落下来，冬天光秃秃只剩枝干。", "qa": [["春天树怎么样？", "发芽"], ["夏天叶子怎么样？", "最密"], ["秋天叶子怎么样？", "变黄落下"], ["冬天树什么样子？", "光秃秃"]], "h": "四季对应四种状态，是结构最整齐的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "83", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "太阳早上从东边升起，中午最高，下午往西落。所以早上的影子在西边，傍晚的影子在东边。", "qa": [["太阳从哪边升起？", "东边"], ["什么时候最高？", "中午"], ["早上的影子在哪边？", "西边"], ["傍晚的影子在哪边？", "东边"]], "h": "方位加时间，答对两个就不错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "84", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "树叶变黄有个过程：先是叶子边发黄，再黄到整片，接着变干卷起来，最后风一吹就掉了。", "qa": [["叶子先从哪儿黄？", "边上"], ["然后黄到哪里？", "整片"], ["接着叶子怎么样？", "变干卷起来"], ["最后怎么样？", "被风吹掉"]], "h": "四个阶段，是这档最细的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "85", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "蜘蛛结网，先拉一根长丝固定在两棵树之间，再一根一根往两边织，最后在网上等虫子飞过来。", "qa": [["先做什么？", "拉一根长丝固定"], ["固定在哪里？", "两棵树之间"], ["然后怎么织？", "一根一根往两边织"], ["最后做什么？", "等虫子飞来"]], "h": "三步，是本主题的典型题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "86", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉理解", "s": "蚂蚁找到饼干渣自己搬不动，用触角碰碰同伴，一会儿来了一队，一起把饼干渣抬回洞里。", "qa": [["蚂蚁找到了什么？", "饼干渣"], ["它自己搬得动吗？", "搬不动"], ["用什么碰同伴？", "触角"], ["最后搬到哪里？", "洞里"]], "h": "「触角」是传递消息的方式，是知识点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "87", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "蘑菇不是一夜长成的：先是土里一个白点，过两天长成小伞，再过几天伞盖张开，最后边缘卷起来就老了。", "qa": [["最开始是什么？", "一个白点"], ["过两天长成什么？", "小伞"], ["后来伞盖怎么样？", "张开"], ["最后边缘怎么样？", "卷起来"]], "h": "四个生长阶段，时间词是线索。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "88", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉顺序", "s": "蒲公英开黄花，花谢后长出白绒球；风一吹绒球散开，一颗颗带小伞的种子就飞到别处去了。", "qa": [["开什么颜色的花？", "黄色"], ["花谢后长出什么？", "白绒球"], ["风一吹绒球怎么样？", "散开"], ["种子飞到哪去？", "别处"]], "h": "花—绒球—种子，三个阶段。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "89", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉理解", "s": "树砍倒以后，树桩上有一圈一圈的纹路叫年轮。数一数年轮有几圈，就知道这棵树长了多少年。", "qa": [["树桩上有什么？", "一圈一圈的纹路"], ["纹路叫什么？", "年轮"], ["数圈能知道什么？", "树的年龄"], ["一圈代表什么？", "一年"]], "h": "「一圈一年」是核心结论。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "90", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 3, "ab": "听觉理解", "s": "下过雨以后，路上有小水洼，里面能看见天和树，因为水面像镜子。太阳一晒，过半天就干了。", "qa": [["雨后路上有什么？", "小水洼"], ["水洼里能看见什么？", "天和树"], ["为什么能看见？", "水面像镜子"], ["水洼为什么干了？", "被太阳晒的"]], "h": "「像镜子」是这题的思维点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "91", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "皇帝爱穿新衣。两个骗子说能织出只有聪明人才看得见的布。皇帝和大臣都看不见，可谁也不敢说。", "qa": [["皇帝爱做什么？", "穿新衣"], ["骗子说布有什么特别？", "只有聪明人看得见"], ["皇帝看得见吗？", "看不见"], ["大臣说了实话吗？", "没有"]], "h": "「为什么大臣不说实话」是核心，答出来才算懂。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "92", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "渔夫捕到一条金鱼，金鱼求他放生。他老婆先要木盆，再要房子，最后要当女皇。第三次，金鱼游走了。", "qa": [["渔夫捕到什么？", "一条金鱼"], ["老婆先要什么？", "木盆"], ["最后要什么？", "当女皇"], ["第三次金鱼怎么样？", "游走了"]], "h": "三次愿望层层加码，是这故事的结构。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "93", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "狐狸夸乌鸦唱歌好听，乌鸦一高兴张开嘴，嘴里的肉就掉下去了，狐狸叼起来跑进树林。", "qa": [["狐狸夸乌鸦什么？", "唱歌好听"], ["乌鸦一张嘴怎么了？", "肉掉下去了"], ["谁把肉叼走了？", "狐狸"], ["乌鸦为什么上当？", "爱听好话"]], "h": "「为什么上当」是这个故事的理。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "94", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "老虎抓住狐狸要吃它。狐狸说自己是天帝派来管百兽的，让老虎跟着走一趟。动物看见老虎都跑了，老虎以为怕的是狐狸。", "qa": [["谁抓住狐狸？", "老虎"], ["狐狸说自己是管什么的？", "管百兽"], ["动物看见谁跑？", "老虎"], ["老虎以为它们怕谁？", "狐狸"]], "h": "「其实怕的是老虎」是机关，答出来说明听明白了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "95", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉顺序", "s": "几个人分一壶酒，说好在纸上画蛇，谁先画完谁喝。一个人画得最快，又给蛇添上脚，结果酒被别人喝了。", "qa": [["他们比什么？", "画蛇"], ["谁画得最快？", "一个人"], ["他画完又做了什么？", "给蛇添脚"], ["最后酒被谁喝了？", "别人"]], "h": "「多此一举」的道理，可以等他自己说。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "96", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "北风和太阳比谁厉害，说谁能让路人脱下大衣谁就赢。北风使劲吹，路人裹得更紧；太阳暖暖地晒，路人自己脱了。", "qa": [["谁和谁比厉害？", "北风和太阳"], ["比什么？", "让路人脱大衣"], ["北风吹完怎么样？", "路人裹得更紧"], ["谁赢了？", "太阳"]], "h": "「为什么太阳赢」是核心，答出来才算懂。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "97", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "灰姑娘的两个姐姐去参加舞会，仙女用南瓜变成马车、老鼠变成马，还给她一双水晶鞋，说十二点前回来。", "qa": [["谁去参加舞会？", "两个姐姐"], ["南瓜变成了什么？", "马车"], ["老鼠变成了什么？", "马"], ["几点前必须回来？", "十二点"]], "h": "三样变身加一个时间，是本档的重点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "98", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 3, "ab": "听觉理解", "s": "公主的金球掉进井里，青蛙帮她捡上来，条件是让它一起吃饭睡觉。公主答应了，可拿到球就跑了 " stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}];
const TOTAL = 300;

let levelSel = 1, themeSel = null, list = [], cur = 0;
let qi = 0, secs = 30, left = 30, tickId = null, revealed = false;

const $ = id => document.getElementById(id);
const jump = $('jump');

const THEME_ORDER = [];
const THEME_NAME = {};
CARDS.forEach(c => {
  if (!THEME_NAME[c.t]) { THEME_NAME[c.t] = c.tn; THEME_ORDER.push(c.t); }
});
themeSel = THEME_ORDER[0];

jump.innerHTML = '';
THEME_ORDER.forEach(t => {
  const o = document.createElement('option');
  o.value = t; o.textContent = THEME_NAME[t];
  jump.appendChild(o);
});

function buildList(){
  list = CARDS.filter(c => (levelSel === 0 || c.l === levelSel) && c.t === themeSel);
  jump.value = themeSel;
  cur = 0;
}

document.querySelectorAll('#lvchips .chip').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#lvchips .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stopTimer();
    levelSel = +b.dataset.l;
    buildList();
    renderCard();
  };
});
jump.onchange = e => { stopTimer(); themeSel = e.target.value; buildList(); renderCard(); };

function accent(){
  const c = list[cur];
  document.body.style.setProperty('--tc', c.c);
  $('tag').style.background = c.c;
}

function renderCard(){
  exitQuiz();
  const c = list[cur];
  accent();
  $('tag').textContent = c.tn + '　' + '★'.repeat(c.l);
  $('story').textContent = c.s;
  $('hint').textContent = '卡壳提示：' + c.h;
  jump.value = themeSel;
  $('count').textContent = '第 ' + (cur + 1) + ' / ' + list.length + ' 张';
  const LD = {0: '全部星级混排 · 建议按星级一档一档往上走',
              1: '★ 一星 · 十几字 · 四个答案都在话里',
              2: '★★ 二星 · 三十字左右 · 要记住两三个信息',
              3: '★★★ 三星 · 四十五字左右 · 有「为什么」和「算一算」'};
  $('lvdesc').textContent = LD[levelSel] || '';

  const box = $('qalist'); box.innerHTML = '';
  c.qa.forEach((p, n) => {
    const d = document.createElement('div');
    d.className = 'qa';
    d.innerHTML = '<div class="qrow"><span class="num" style="background:' + c.c + '">' + (n+1) + '</span>'
      + '<span class="qtext">' + p[0] + '</span></div>'
      + '<div class="ans" style="background:' + c.c + '">' + p[1] + '</div>';
    d.onclick = () => d.classList.toggle('open');
    box.appendChild(d);
  });
  $('pane').scrollTop = 0;
  const last = list.length - 1;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === last;
  $('prev').style.opacity = cur === 0 ? .4 : 1;
  $('next').style.opacity = cur === last ? .4 : 1;
}

/* ---------- 提问模式 ---------- */
function startQuiz(){
  qi = 0;
  $('pane').style.display = 'none';
  $('bar').style.display = 'none';
  document.querySelector('.top').style.display = 'none';
  document.querySelector('.top2').style.display = 'none';
  $('quiz').classList.add('on');
  showQ();
}

function showQ(){
  const c = list[cur];
  accent();
  revealed = false;
  $('storybox').textContent = c.s;
  $('storybox').classList.remove('on');
  $('sg').textContent = '看故事';
  $('qno').textContent = '第 ' + (qi + 1) + ' 题 · ' + c.tn;
  $('qbig').textContent = c.qa[qi][0];
  $('abig').textContent = c.qa[qi][1];
  $('abig').classList.remove('on');
  $('reveal').textContent = '看答案';
  $('nextq').textContent = qi === 3 ? '完成' : '下一题';
  $('sthint').textContent = '';
  [...document.querySelectorAll('.dot')].forEach((d, n) => {
    d.className = 'dot' + (n < qi ? ' done' : n === qi ? ' now' : '');
  });
  $('quiz').scrollTop = 0;
  startTimer();
}

function startTimer(){
  stopTimer();
  left = secs;
  paintTimer();
  tickId = setInterval(() => {
    left -= 0.1;
    if (left <= 0) { left = 0; paintTimer(); stopTimer(); doReveal(true); return; }
    paintTimer();
  }, 100);
}
function stopTimer(){ if (tickId) { clearInterval(tickId); tickId = null; } }
function paintTimer(){
  const p = Math.max(0, left) / secs * 100;
  $('tfill').style.width = p + '%';
  $('tnum').textContent = Math.ceil(Math.max(0, left)) + 's';
}

function doReveal(auto){
  if (revealed) return;
  revealed = true;
  stopTimer();
  $('abig').classList.add('on');
  $('reveal').textContent = '已公布';
  $('tnum').textContent = '停';
  $('sthint').textContent = auto ? '时间到 —— 看看他卡在哪一步，别急着说答案' : '';
  if (navigator.vibrate) navigator.vibrate(30);
}

$('reveal').onclick = () => doReveal(false);

$('sg').onclick = () => {
  const on = $('storybox').classList.toggle('on');
  $('sg').textContent = on ? '收起' : '看故事';
};

function finish(){
  stopTimer();
  const c = list[cur];
  $('qno').textContent = '这一张做完了';
  $('qbig').textContent = '四题都过完了';
  $('abig').textContent = cur < list.length - 1 ? '点下面「下一张」继续' : '这一档到这里结束';
  $('abig').classList.add('on');
  $('tfill').style.width = '100%';
  $('tnum').textContent = '—';
  $('sthint').textContent = '';
  $('reveal').textContent = '看答案';
  $('nextq').textContent = '再来一遍';
  $('nextq').onclick = () => { qi = 0; showQ(); $('nextq').onclick = nextHandler; };
  $('quiz').dataset.done = '1';
}

const nextHandler = () => {
  if (qi < 3) { qi++; showQ(); } else { finish(); }
};
$('nextq').onclick = nextHandler;

$('quit').onclick = () => { exitQuiz(); };

function exitQuiz(){
  stopTimer();
  $('quiz').classList.remove('on');
  $('pane').style.display = '';
  $('bar').style.display = '';
  document.querySelector('.top').style.display = '';
  document.querySelector('.top2').style.display = '';
  $('quiz').dataset.done = '';
  $('nextq').onclick = nextHandler;
}

/* ---------- 底部导航 ---------- */
$('start').onclick = startQuiz;
$('prev').onclick = () => { if (cur > 0) { cur--; renderCard(); } };
$('next').onclick = () => { if (cur < list.length - 1) { cur++; renderCard(); } };

document.querySelectorAll('.set .chip').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.set .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    secs = +b.dataset.s;
    if ($('quiz').classList.contains('on') && !revealed) startTimer();
  };
});

buildList();
renderCard();
</script>
</body>
</html>
