troke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "36", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "袜子找不到了，我先看床底下，再翻衣柜，最后在洗衣机里找到，已经洗过了。", "qa": [["找不到什么？", "袜子"], ["先看哪里？", "床底下"], ["翻了哪里？", "衣柜"], ["最后在哪里找到？", "洗衣机里"]], "h": "三个地点的顺序，是听指令类的核心。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "37", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "擦窗户先用湿布擦一遍，等水干了再用干报纸擦，最后用纸巾抹掉边角的水痕。", "qa": [["先用什么擦？", "湿布"], ["第二遍用什么？", "干报纸"], ["最后用什么擦边角？", "纸巾"], ["为什么要等水干？", "不然擦不亮"]], "h": "三个工具三种顺序。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "38", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉理解", "s": "冰箱分上下两层。上层放牛奶和鸡蛋，下层放青菜和肉，妈妈说西瓜也要放下面。", "qa": [["冰箱分几层？", "两层"], ["上层放什么？", "牛奶和鸡蛋"], ["西瓜放哪层？", "下层"], ["为什么放下面？", "下面更冷"]], "h": "三样东西加一个原因。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "39", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "我不小心把杯子摔了，碎成三块，水洒了一地。我先用抹布擦水，再用扫帚扫碎片。", "qa": [["我摔了什么？", "杯子"], ["碎成几块？", "三块"], ["先用什么擦水？", "抹布"], ["再用什么扫碎片？", "扫帚"]], "h": "抹布和扫帚两个工具，正好考分开记。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "40", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉理解", "s": "爷爷的椅子只有三条腿，一坐就晃。他找了块小木片垫在短腿下面，椅子就稳了。", "qa": [["椅子有几条腿？", "三条"], ["坐上去会怎么样？", "晃"], ["爷爷找了什么？", "一块小木片"], ["垫好以后怎么样？", "稳了"]], "h": "「三条腿」是关键，孩子常答四条。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "41", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "指甲长了要剪。妈妈先用温水给我泡手，再用指甲刀一个一个剪，最后磨平。", "qa": [["指甲长了要做什么？", "剪"], ["先做什么？", "用温水泡手"], ["用什么剪？", "指甲刀"], ["最后做什么？", "磨平"]], "h": "三步顺序，是身体类的典型题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "42", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉记忆", "s": "妈妈在墙上给我量身高，去年一米一，今年一米一八，长高了八厘米。", "qa": [["去年多高？", "一米一"], ["今年多高？", "一米一八"], ["长高了多少？", "八厘米"], ["在哪里量的？", "墙上"]], "h": "数字题，答对两个就够好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "43", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "打针的时候，护士先用棉签擦一擦胳膊，再很快扎进去，最后贴上一小块胶布。", "qa": [["护士先做什么？", "用棉签擦胳膊"], ["扎在哪里？", "胳膊"], ["最后贴什么？", "一小块胶布"], ["棉签是干什么用的？", "消毒"]], "h": "顺序题，孩子有经验答得比抽象题好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "44", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "洗澡要先试一试水温，再打湿身体，搓上泡泡冲干净，最后用毛巾擦干。", "qa": [["第一步做什么？", "试水温"], ["搓上什么？", "泡泡"], ["怎么冲？", "冲干净"], ["最后用什么擦？", "毛巾"]], "h": "四步，答对三步就已经很好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "45", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "夏天跑完步，我满头都是汗。汗流到眼睛里有点辣，妈妈说这是身体在散热。", "qa": [["跑完步头上有什么？", "汗"], ["汗流到哪里会辣？", "眼睛里"], ["妈妈说这是身体在做什么？", "散热"], ["什么季节容易出汗？", "夏天"]], "h": "「散热」答不出就解释成「把热气排出去」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "46", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "打哈欠的时候，嘴巴张得大大的，眼睛会不自觉闭上，打完就想睡觉。", "qa": [["打哈欠嘴巴怎么样？", "张得大大的"], ["眼睛会怎么样？", "闭上"], ["打完想做什么？", "睡觉"], ["打哈欠说明身体怎么了？", "困了"]], "h": "最后一问是开放题，答「累了」就对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "47", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "照镜子的时候，我举起右手，镜子里的人举的却是左手。妈妈说，镜子是反的。", "qa": [["我举右手，镜子里举哪只？", "左手"], ["为什么会这样？", "镜子是反的"], ["谁告诉我原因的？", "妈妈"], ["镜子里的人和我一样吗？", "一样但是反的"]], "h": "反直觉题，答对很不容易，要多夸。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "48", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉记忆", "s": "我发烧了，妈妈用体温计量出三十八度五，说超过三十七度就算发烧。", "qa": [["用什么量体温？", "体温计"], ["量出来多少度？", "三十八度五"], ["超过多少度算发烧？", "三十七度"], ["谁给我量的？", "妈妈"]], "h": "两个度数，是本档的难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "49", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "我的膝盖磕破了。先是流血，妈妈用清水冲干净，涂上药水，最后贴上创可贴。", "qa": [["膝盖先怎么样？", "流血"], ["妈妈用什么冲？", "清水"], ["涂上什么？", "药水"], ["最后贴上什么？", "创可贴"]], "h": "四步处理，是实用性最强的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "50", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "我吃饭太快打了个嗝。奶奶让我喝几口温水，慢慢咽，过一会儿就不打了。", "qa": [["我为什么打嗝？", "吃饭太快"], ["奶奶让我喝什么？", "温水"], ["要怎么咽？", "慢慢咽"], ["过一会儿怎么样？", "就不打了"]], "h": "生活小事，孩子容易共情。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "51", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉记忆", "s": "天气预报说最高二十度、最低十二度，下午有阵雨，妈妈让我把伞放进书包。", "qa": [["最高几度？", "二十度"], ["最低几度？", "十二度"], ["下午有什么？", "阵雨"], ["妈妈让我带什么？", "伞"]], "h": "两个温度容易混，先问高的再问低的。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "52", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "台风来的时候风很大，雨是横着飞的。电视里说要关好窗户，别出门。", "qa": [["台风来风怎么样？", "很大"], ["雨是怎么飞的？", "横着飞"], ["要关好什么？", "窗户"], ["能不能出门？", "不能"]], "h": "「横着飞」是这题的形象点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "53", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "下雾天走路要穿颜色亮一点的衣服，让司机早点看见，还要靠着边走。", "qa": [["下雾天要穿什么？", "颜色亮的"], ["为什么穿亮的？", "让司机早点看见"], ["走路要靠哪边？", "靠边走"], ["雾天看得清吗？", "看不清"]], "h": "安全题，答对要郑重夸一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "54", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "昨天下冰雹，一颗颗像黄豆那么大，打在窗户上啪啪响，捡起来是硬冰球。", "qa": [["昨天下什么？", "冰雹"], ["有多大？", "像黄豆那么大"], ["打在窗户上什么声音？", "啪啪响"], ["冰雹是什么？", "硬冰球"]], "h": "冰雹和雨、雪都不同，是辨听点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "55", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉顺序", "s": "打雷下大雨的时候，先关掉电视，再拔掉插头，然后离窗户远一点。", "qa": [["先做什么？", "关掉电视"], ["再做什么？", "拔掉插头"], ["要离什么远一点？", "窗户"], ["为什么要拔插头？", "怕雷打坏"]], "h": "四步安全指令，是天气类最实用的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "56", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉顺序", "s": "春天播种，要先把土翻松，再撒下种子，盖上一层薄土，最后浇透水。", "qa": [["第一步做什么？", "把土翻松"], ["然后撒什么？", "种子"], ["盖上一层什么？", "薄土"], ["最后做什么？", "浇透水"]], "h": "可以真的种一盆，比背步骤有用。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "57", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "冬天路上结了薄冰，走上去很滑。妈妈让我小步走，手不要插在兜里。", "qa": [["路上结了什麼？", "薄冰"], ["走上去怎么样？", "很滑"], ["要怎么走？", "小步走"], ["手为什么不能插兜？", "滑倒能扶一下"]], "h": "「为什么不能插兜」是因果题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "58", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "天上飘着几朵白云，像一团团棉花。风一吹它们就慢慢移动，一会儿就散了。", "qa": [["天上飘着什么？", "白云"], ["白云像什么？", "棉花"], ["风一吹它们怎么样？", "慢慢移动"], ["最后怎么样了？", "散了"]], "h": "三个变化连着，答对两个就不错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "59", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "早上草叶上挂着露水，一颗颗亮亮的。太阳一出来，露水就不见了。", "qa": [["草叶上挂着什么？", "露水"], ["露水是什么样子的？", "亮亮的"], ["什么时候有露水？", "早上"], ["太阳出来以后怎么样？", "不见了"]], "h": "可以早上带他去看一次露水。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "60", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉顺序", "s": "水被太阳晒热变成水汽，飘到天上遇到冷空气，聚成小水珠，就成了云。", "qa": [["水被晒热变成什么？", "水汽"], ["水汽飘到哪里？", "天上"], ["遇到冷空气聚成什么？", "小水珠"], ["小水珠聚在一起是什么？", "云"]], "h": "四步变化，是本档最抽象的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "61", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉顺序", "s": "开运动会那天，我们先走方队，再比跳绳，然后比接力跑，最后全班一起拍照。", "qa": [["先做什么？", "走方队"], ["接着比什么？", "跳绳"], ["再比什么？", "接力跑"], ["最后做什么？", "全班拍照"]], "h": "四个环节，答对三个就是优秀。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "62", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉理解", "s": "绘本课上，老师讲了《好饿的毛毛虫》，讲完问小朋友：它最后变成了什么？", "qa": [["老师讲了什么故事？", "好饿的毛毛虫"], ["讲的是谁？", "毛毛虫"], ["老师最后问了什么？", "它变成了什么"], ["毛毛虫后来变成了什么？", "蝴蝶"]], "h": "这个故事他可能听过，正好考迁移。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "63", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉顺序", "s": "我和朵朵抢积木吵了一架。后来我先说了对不起，她也说了，我们就一起搭了座桥。", "qa": [["我和谁吵架？", "朵朵"], ["为什么吵？", "抢积木"], ["谁先道歉？", "我"], ["后来一起搭了什么？", "一座桥"]], "h": "可以聊一句：吵架不丢人，会道歉才重要。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "64", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉顺序", "s": "小汽车不见了。我先找自己的柜子，又找桌子下面，最后在积木箱里找到。", "qa": [["什么不见了？", "小汽车"], ["先在哪里找？", "自己的柜子"], ["又在哪里找？", "桌子下面"], ["最后在哪里找到？", "积木箱里"]], "h": "三个地点的顺序，是本档典型题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "65", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉理解", "s": "老师给我们换了座位。我原来坐在第二排靠窗，现在换到第四排靠门。", "qa": [["原来坐在第几排？", "第二排"], ["原来靠哪里？", "靠窗"], ["现在坐在第几排？", "第四排"], ["现在靠哪里？", "靠门"]], "h": "两个位置对应两个特征，最容易串。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "66", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉顺序", "s": "春游那天，我们先坐大巴到公园，再跟着老师看花，在草地上吃午饭，最后上车回去。", "qa": [["怎么去公园？", "坐大巴"], ["到公园先做什么？", "看花"], ["在哪里吃午饭？", "草地上"], ["最后做什么？", "上车回去"]], "h": "四步行程，是本主题最完整的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "67", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉记忆", "s": "六一表演，我们班跳舞。我站在第三排中间，穿黄色的衣服，手里拿着一朵纸花。", "qa": [["我们班表演什么？", "跳舞"], ["我站在第几排？", "第三排"], ["穿什么颜色的衣服？", "黄色"], ["手里拿着什么？", "一朵纸花"]], "h": "这套细节练的是「听描述在脑里成像」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "68", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉顺序", "s": "喝水要排队：先拿自己的杯子，再站到队伍最后，轮到了接半杯水。", "qa": [["先做什么？", "拿自己的杯子"], ["站在哪里？", "队伍最后"], ["接多少水？", "半杯"], ["为什么只接半杯？", "不容易洒"]], "h": "三步，加上「半杯」这个细节。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "69", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉理解", "s": "今天王老师请假了，来了一位李老师。她带我们唱了一首歌，下午教我们折纸。", "qa": [["谁请假了？", "王老师"], ["新老师姓什么？", "李"], ["她带我们做了什么？", "唱歌"], ["下午教什么？", "折纸"]], "h": "「姓李」不是「叫李」，注意听。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "70", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 2, "ab": "听觉理解", "s": "我带的新橡皮不见了，以为是同桌拿的，跟他吵了一架。后来在自己书包夹层找到了。", "qa": [["什么不见了？", "新橡皮"], ["我以为是谁拿的？", "同桌"], ["后来在哪里找到？", "书包夹层"], ["我冤枉人了吗？", "冤枉了"]], "h": "重点在「误会」，答出来说明真听懂了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 28 V84\" stroke=\"#534AB7\" stroke-width=\"3\"/>\n<path d=\"M50 28 Q34 20 18 28 V80 Q34 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M50 28 Q66 20 82 28 V80 Q66 72 50 80\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "71", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉顺序", "s": "做三明治，先把面包片摆好，再抹一层沙拉酱，放上生菜和火腿，盖起来切两半。", "qa": [["先做什么？", "摆好面包片"], ["抹什么？", "沙拉酱"], ["放上什么？", "生菜和火腿"], ["最后怎么切？", "切两半"]], "h": "四步制作，是最典型的顺序题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "72", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉理解", "s": "街边的烤红薯用一个大铁桶烤。烤好的皮皱皱的，掰开冒白气，里面是金黄色。", "qa": [["红薯用什么烤？", "大铁桶"], ["烤好的皮怎么样？", "皱皱的"], ["掰开冒什么？", "白气"], ["里面是什么颜色？", "金黄色"]], "h": "「皱皱的」是形象细节，答出来说明听得细。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "73", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉顺序", "s": "糖葫芦是把山楂一颗颗串在竹签上，再在糖稀里滚一圈，拿出来放凉就变硬了。", "qa": [["山楂串在哪里？", "竹签上"], ["再裹什么？", "糖稀"], ["拿出来做什么？", "放凉"], ["糖最后怎么样？", "变硬"]], "h": "串、裹、晾、硬，四个环节。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "74", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉顺序", "s": "打豆浆要提前一晚泡黄豆，第二天倒进豆浆机，加上水，等它响三声就好了。", "qa": [["黄豆要提前多久泡？", "一晚"], ["倒进什么里？", "豆浆机"], ["还要加什么？", "水"], ["响几声就好？", "三声"]], "h": "「提前一晚」是时间点，容易漏。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "75", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉记忆", "s": "爸爸做蛋炒饭，用了两碗米饭、三个鸡蛋。他先炒蛋盛出来，再炒饭，最后拌回去。", "qa": [["用了几碗米饭？", "两碗"], ["几个鸡蛋？", "三个"], ["先炒什么？", "鸡蛋"], ["最后做什么？", "把蛋拌回去"]], "h": "数量和顺序混在一起，是本题难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "76", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉顺序", "s": "吃虾要先剥壳：先把头拧掉，再把壳一节一节剥开，最后挑出背上的黑线。", "qa": [["先做什么？", "把头拧掉"], ["壳怎么剥？", "一节一节剥"], ["要挑出什么？", "背上的黑线"], ["挑完才能做什么？", "吃"]], "h": "三步，孩子有吃虾经验会答得很快。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "77", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉理解", "s": "和面要一点点加水，边加边搅，搅成絮状再用手揉，揉到光滑不粘手。", "qa": [["面粉里要加什么？", "水"], ["怎么加？", "一点点加"], ["搅成什么样？", "絮状"], ["揉到什么程度？", "光滑不粘手"]], "h": "「絮状」答成「一小团一小团」也对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "78", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉理解", "s": "冰箱里的剩菜放了四天，闻起来有点酸。妈妈说长了细菌，不能吃了。", "qa": [["剩菜放了几天？", "四天"], ["闻起来怎么样？", "有点酸"], ["妈妈为什么说不能吃？", "长细菌了"], ["吃了会怎么样？", "拉肚子"]], "h": "健康常识题，答对要专门肯定。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "79", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉记忆", "s": "我跟妈妈去买菜，买了三根茄子、一斤豆角、两条鱼，一共花了三十二块。", "qa": [["买了几根茄子？", "三根"], ["买了几条鱼？", "两条"], ["一共花了多少钱？", "三十二块"], ["买了哪三样？", "茄子、豆角、鱼"]], "h": "三样东西加一个总价，是综合题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "80", "t": "food", "tn": "好吃的东西", "c": "#993C1D", "bg": "#FAECE7", "l": 2, "ab": "听觉理解", "s": "吃饭的时候爷爷先动筷子，我们才动。夹菜不能翻来翻去，嘴里有东西不要说话。", "qa": [["谁先动筷子？", "爷爷"], ["夹菜不能怎么样？", "翻来翻去"], ["嘴里有东西不要做什么？", "说话"], ["这些是谁定的规矩？", "家里的规矩"]], "h": "三条规矩，答对两条就算听进去了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M22 54 H78 V82 H22 Z\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M22 54 Q32 44 42 54 Q52 44 62 54 Q72 44 78 54\" fill=\"#fff\" stroke=\"#993C1D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n<path d=\"M50 22 V42\" stroke=\"#993C1D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 22 Q56 16 50 10 Q44 16 50 22\" fill=\"#F5C4B3\" stroke=\"#993C1D\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "81", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉顺序", "s": "蜘蛛先拉一根长丝，固定在两棵树之间，再一根一根往两边织网。", "qa": [["先做什么？", "拉一根长丝"], ["固定在哪里？", "两棵树之间"], ["然后怎么织？", "一根一根往两边织"], ["织好以后做什么？", "等虫子"]], "h": "三步顺序，是自然类的典型题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "82", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "蜗牛爬得很慢，身后会留下一道亮亮的痕迹，那是它分泌的黏液。", "qa": [["蜗牛爬得快还是慢？", "很慢"], ["身后留下什么？", "亮亮的痕迹"], ["痕迹是什么？", "黏液"], ["黏液有什么用？", "帮它爬"]], "h": "最后一问是推理，答不出就提示「滑滑的好爬」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "83", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉顺序", "s": "蘑菇不是一夜长成的。先是土里冒出一个小白点，过两天长成小伞，再几天伞盖张开。", "qa": [["最开始是什么？", "小白点"], ["过两天长成什么？", "小伞"], ["后来伞盖怎么样？", "张开"], ["蘑菇长在哪里？", "土里"]], "h": "三个阶段，时间词是线索。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "84", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "蚂蚁找到一块饼干渣，自己搬不动。它用触角碰碰同伴，一会儿就来了一队。", "qa": [["蚂蚁找到了什么？", "饼干渣"], ["它自己搬得动吗？", "搬不动"], ["它用什么碰同伴？", "触角"], ["后来怎么样了？", "来了一队蚂蚁"]], "h": "「触角」是传递消息的方式。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "85", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉顺序", "s": "蒲公英开黄花，花谢了长出白色绒球。风一吹，种子带着小伞飞走了。", "qa": [["蒲公英开什么颜色的花？", "黄色"], ["花谢以后长出什么？", "白绒球"], ["风一吹绒球怎么样？", "散了"], ["种子带着什么飞？", "小伞"]], "h": "花—绒球—种子，三个阶段。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "86", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "树桩上有一圈一圈的纹路，叫年轮。数一数有几圈，就知道这棵树长了多少年。", "qa": [["树桩上有什么？", "一圈一圈的纹路"], ["纹路叫什么？", "年轮"], ["数圈能知道什么？", "树的年龄"], ["一圈代表什么？", "一年"]], "h": "「一圈一年」是核心结论。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "87", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "下过雨以后，路上有好多小水洼。水洼里能看见天和树，太阳一晒就干了。", "qa": [["雨后路上有什么？", "小水洼"], ["水洼里能看见什么？", "天和树"], ["为什么能看见？", "水面像镜子"], ["水洼为什么干了？", "被太阳晒的"]], "h": "「像镜子」是思维点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "88", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉顺序", "s": "蝴蝶一开始是毛毛虫，它吃了很多叶子，把自己包成蛹，最后钻出一只蝴蝶。", "qa": [["蝴蝶一开始是什么？", "毛毛虫"], ["它吃了很多什么？", "叶子"], ["把自己变成了什么？", "蛹"], ["最后钻出什么？", "蝴蝶"]], "h": "「蛹」这个字陌生，念完可以解释一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "89", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "蜜蜂住在蜂巢里，飞到花上采蜜，腿上沾满了黄色的花粉。", "qa": [["蜜蜂住在哪里？", "蜂巢里"], ["它到花上做什么？", "采蜜"], ["腿上沾着什么？", "黄色花粉"], ["花粉和蜂蜜是一回事吗？", "不是"]], "h": "花粉和蜂蜜两个词，孩子容易混。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "90", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 2, "ab": "听觉理解", "s": "雨后草地上冒出了蘑菇，有圆圆的伞盖，下面是一根白白的柄。", "qa": [["蘑菇什么时候冒出来？", "雨后"], ["伞盖是什么形状？", "圆形"], ["下面是什么？", "白白的柄"], ["蘑菇长在哪里？", "草地上"]], "h": "野外蘑菇不能随便吃，可以补一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "91", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "灰姑娘的两个姐姐去参加舞会，仙女用南瓜变成马车，还说要十二点前回来。", "qa": [["谁去参加舞会？", "两个姐姐"], ["南瓜变成了什么？", "马车"], ["谁变的？", "仙女"], ["几点前必须回来？", "十二点"]], "h": "三样变身加一个时间。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "92", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "拇指姑娘只有大拇指那么大，睡在核桃壳里。一只癞蛤蟆把她偷走，小鱼帮她逃走。", "qa": [["拇指姑娘有多大？", "大拇指那么大"], ["她睡在哪里？", "核桃壳里"], ["谁把她偷走了？", "癞蛤蟆"], ["谁帮她逃走？", "小鱼"]], "h": "「癞蛤蟆」陌生的话先解释一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "93", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "公主的金球掉进了井里，青蛙帮她捡上来，条件是一起吃饭，她拿到球就跑了。", "qa": [["公主的什么掉进井里？", "金球"], ["谁帮她捡上来？", "青蛙"], ["青蛙的条件是什么？", "一起吃饭"], ["公主拿到球以后呢？", "跑了"]], "h": "「守信」是这个故事的点，可以问一句她做得对吗。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "94", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "王后在二十层被子下面压了一粒豌豆，姑娘一夜没睡好，王后才知道她是真公主。", "qa": [["被子有几层？", "二十层"], ["下面压着什么？", "一粒豌豆"], ["姑娘睡得怎么样？", "一夜没睡好"], ["王后因此知道了什么？", "她是真公主"]], "h": "「二十层被子加一粒豌豆」是荒诞点，容易记住。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "95", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "狐狸请鹤吃饭，汤盛在平盘子里，鹤喝不到；后来鹤用细长瓶子请它，狐狸也吃不到。", "qa": [["狐狸请谁吃饭？", "鹤"], ["汤盛在什么里？", "平盘子"], ["鹤为什么喝不到？", "嘴又长又尖"], ["鹤用什么装食物？", "细长瓶子"]], "h": "两边对称，是这题的逻辑。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "96", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "青蛙坐在井里，说天只有井口那么大。小鸟告诉它天很大，青蛙不信。", "qa": [["青蛙坐在哪里？", "井里"], ["它说天有多大？", "井口那么大"], ["谁告诉它天很大？", "小鸟"], ["青蛙信了吗？", "不信"]], "h": "可以问：为什么它看到的天那么小？", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "97", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "大年夜，一个小女孩在街上卖火柴。她擦亮一根看见了火炉，擦亮一把看见了奶奶。", "qa": [["小女孩在卖什么？", "火柴"], ["擦第一根看见什么？", "火炉"], ["擦一把看见了谁？", "奶奶"], ["这是什么日子？", "大年夜"]], "h": "故事偏伤感，念完停一下，别追问太多。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "98", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉顺序", "s": "小蝌蚪找妈妈。先遇到鸭子，说妈妈有四条腿；又遇到乌龟，说妈妈肚皮是白的。", "qa": [["先遇到谁？", "鸭子"], ["鸭子说妈妈有几条腿？", "四条"], ["又遇到谁？", "乌龟"], ["乌龟说妈妈肚皮什么颜色？", "白色"]], "h": "两次询问，是这个故事的结构。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "99", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "狐狸够不着葡萄，跳了好几次都失败，最后说这葡萄是酸的，其实它根本没尝过。", "qa": [["狐狸想吃什么？", "葡萄"], ["它跳了几次？", "好几次"], ["最后它说什么？", "葡萄是酸的"], ["它真的尝过了吗？", "没有"]], "h": "最后一问是这题的机关，答出来说明听懂了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "100", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 2, "ab": "听觉理解", "s": "两只小羊过独木桥，一个从东来一个从西来，中间谁也不让谁，一起掉进河里。", "qa": [["两只小羊要过什么桥？", "独木桥"], ["一个从哪边来？", "东边"], ["走到中间怎么样？", "谁也不让谁"], ["最后怎么样？", "一起掉进河里"]], "h": "可以顺势问：应该怎么办才对？", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "01", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "两只小熊捡到一块饼，谁都想多要。狐狸掰成一大一小，谁抢大的它就咬一口，最后饼全进了它肚子。", "qa": [["谁捡到了饼？", "两只小熊"], ["谁来分饼？", "狐狸"], ["狐狸把饼掰成什么样？", "一大一小"], ["最后饼到哪里去了？", "狐狸肚子里"]], "h": "最后一问是这题的答案所在，答出来说明听懂了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "02", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "小鹿到河边喝水，看见水里也有一只小鹿。它低下头想顶它，水里的也低头。妈妈说那是它的影子。", "qa": [["小鹿去哪里喝水？", "河边"], ["水里是什么？", "它自己的影子"], ["它想做什么？", "用头顶水里那只"], ["妈妈怎么说的？", "那是它的影子"]], "h": "孩子答不出「影子」很正常，先问「水里的鹿有没有动」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "03", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "猫头鹰白天睡觉，别的鸟白天飞。到了晚上它睁大眼睛站在树上，田鼠一出来就扑下去，抓得很准。", "qa": [["猫头鹰白天做什么？", "睡觉"], ["它什么时候出来？", "晚上"], ["它站在哪里？", "树上"], ["它抓什么抓得准？", "田鼠"]], "h": "「白天睡、晚上醒」是这题的核心对照。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "04", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "小刺猬看见地上有个苹果，滚过去扎在背上背回家。路上又看见一个，它翻个身把两个都扎住了。", "qa": [["小刺猬用什么弄苹果？", "背上的刺"], ["它怎么扎上去的？", "滚过去扎"], ["路上又看见什么？", "一个苹果"], ["最后它背了几个？", "两个"]], "h": "「翻个身」是第二个苹果的关键动作。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "05", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "小狼跟妈妈学抓兔子。它直着冲过去，兔子一拐弯就钻进洞里。妈妈说不能直着跑，要绕到前面去。", "qa": [["小狼跟谁学本领？", "妈妈"], ["它怎么冲过去的？", "直着冲"], ["兔子怎么跑掉的？", "拐弯钻进洞里"], ["妈妈说该怎么抓？", "绕到前面去"]], "h": "最后一问是「方法」，答不出来就问「直着跑能抓到吗」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "06", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉记忆", "s": "小猴子摘了七个香蕉装进篮子。回家路上绊了一跤掉了两个，走到河边又被小鸟叼走一个。", "qa": [["摘了几个香蕉？", "七个"], ["路上掉了几个？", "两个"], ["被谁叼走一个？", "小鸟"], ["还剩几个？", "四个"]], "h": "最后一问算不出来，就一步步扣：七个、少两个、再少一个。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "07", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉记忆", "s": "小熊请客，准备了三条鱼、四根玉米和一罐蜂蜜。小兔不吃鱼，端来玉米；小猴抱着蜂蜜不撒手。", "qa": [["准备了几条鱼？", "三条"], ["小兔吃什么？", "玉米"], ["小猴抱着什么不放？", "蜂蜜"], ["谁不吃鱼？", "小兔"]], "h": "名字和食物容易串，可以画三个小人帮他记。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "08", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉顺序", "s": "快下雨了，一群蚂蚁排队搬家。最前面扛着一粒米，后面抬着一片树叶。半路一只小蚂蚁掉队，队长回头等它。", "qa": [["蚂蚁为什么搬家？", "快下雨了"], ["最前面扛着什么？", "一粒米"], ["后面的抬着什么？", "一片树叶"], ["谁掉队了？", "一只小蚂蚁"]], "h": "「为什么」这类问题，让他先说「因为」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "09", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "小猫跟妈妈去河边钓鱼，一会儿追蜻蜓一会儿捉蝴蝶，一条也没钓到。妈妈一动不动，桶里已经有四条。", "qa": [["小猫和谁去钓鱼？", "妈妈"], ["小猫在追什么？", "蜻蜓和蝴蝶"], ["妈妈钓到几条？", "四条"], ["小猫为什么没钓到？", "她总在玩"]], "h": "可以顺势聊一句：钓鱼要坐得住。别讲太久。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "10", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 3, "ab": "听觉理解", "s": "池塘边小鸭和大白鹅比赛游泳。哨响小鸭游得飞快，半路看见蝴蝶就停下追，大白鹅一直游到对岸。", "qa": [["谁和谁比赛？", "小鸭子和大白鹅"], ["小鸭为什么停下？", "去追蝴蝶"], ["谁先到对岸？", "大白鹅"], ["小鸭为什么会输？", "中途去追蝴蝶"]], "h": "一次只问一个，问完等他答。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "11", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉顺序", "s": "爷爷挑西瓜：先拍一拍听声音，再看瓜底的圈，圈越大越熟；最后看瓜藤，藤枯了才甜。", "qa": [["爷爷先做什么？", "拍一拍听声音"], ["再看什么？", "瓜底的圈"], ["圈越大说明什么？", "越熟"], ["瓜藤怎么样才甜？", "枯了"]], "h": "三个步骤对应三个判断，是本档重点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "12", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉记忆", "s": "妈妈把两个苹果、一根胡萝卜放进榨汁机。机器响了一会儿，倒出两杯橙色的汁，我喝了说有点甜。", "qa": [["放了哪两样？", "苹果和胡萝卜"], ["放了几个苹果？", "两个"], ["倒出几杯汁？", "两杯"], ["果汁是什么颜色？", "橙色"]], "h": "苹果加胡萝卜榨出来是橙色，这一点可以夸他。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "13", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉顺序", "s": "做果酱：草莓洗净去蒂，倒进锅里加糖，小火慢慢熬到变稠，装进玻璃瓶，放凉了再盖盖子。", "qa": [["草莓要先去什么？", "蒂"], ["加什么一起熬？", "糖"], ["熬到什么程度？", "变稠"], ["什么时候盖盖子？", "放凉以后"]], "h": "四步顺序，答对三步就已经很好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "14", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉记忆", "s": "我们去野餐，带了四个苹果、八个橘子。三个小朋友一人一个苹果、两个橘子，橘子还剩两个。", "qa": [["带了几个苹果？", "四个"], ["有几个小朋友？", "三个"], ["橘子一人几个？", "两个"], ["橘子还剩几个？", "两个"]], "h": "这题要算两次，是全档偏难的。允许掰手指。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "15", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉理解", "s": "蒲公英种子长着小伞，风一吹就飞走；苍耳种子有钩子，粘在裤腿上跟着走；椰子掉进海里，漂到别的岛上。", "qa": [["蒲公英靠什么走？", "风"], ["苍耳怎么走？", "粘在裤腿上"], ["椰子掉海里会怎么样？", "漂到别的岛"], ["哪种靠水走？", "椰子"]], "h": "三种种子三种走法，答对两种就是优秀。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "16", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉记忆", "s": "妈妈给我十块钱买苹果，一斤五块。我买了二斤，钱刚够，一分也没剩，拎着袋子回家。", "qa": [["妈妈给了多少钱？", "十块"], ["一斤多少钱？", "五块"], ["买了几斤？", "二斤"], ["还剩钱吗？", "没有"]], "h": "算不出来就提示「一斤五块，两斤呢」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "17", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉理解", "s": "冰箱里的橘子放了三个星期，皮上长了一层白毛，还发出酸味。妈妈说不能吃了，让我整个扔掉。", "qa": [["橘子放了多久？", "三个星期"], ["皮上长了什么？", "白毛"], ["闻起来怎么样？", "发酸"], ["妈妈让我怎么做？", "整个扔掉"]], "h": "健康题，顺势教一句：看着不对先问大人。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "18", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉顺序", "s": "石榴皮硬，要用刀划开再用手掰。掰开以后挤满亮晶晶的红籽，一颗一颗像小珠子，吃的时候要吐籽。", "qa": [["石榴皮硬还是软？", "硬"], ["用什么划开？", "刀"], ["籽像什么？", "小珠子"], ["吃的时候要注意什么？", "吐籽"]], "h": "「划开再掰」是两步，别当成一步听。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "19", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉理解", "s": "荔枝壳是红的，上面有小疙瘩。剥开是白果肉，中间一颗黑核。妈妈说吃多了会上火，让我只吃五颗。", "qa": [["荔枝壳什么颜色？", "红色"], ["中间有什么？", "一颗黑核"], ["妈妈说吃多了会怎样？", "上火"], ["妈妈让我吃几颗？", "五颗"]], "h": "「上火」这个词先解释一句再问。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "20", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 3, "ab": "听觉记忆", "s": "我摘了八个草莓，洗干净，分给妹妹三个。她吃完还想要，我说剩下的五个明天再分，她点点头。", "qa": [["摘了几个草莓？", "八个"], ["妹妹分了几个？", "三个"], ["还剩几个？", "五个"], ["剩下的什么时候分？", "明天"]], "h": "八减三是这题唯一要算的地方。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "21", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉顺序", "s": "着火了，消防车响着警笛冲过去。消防员先接好水管，再架上梯子，最后爬上去把人救下来。", "qa": [["消防车怎么去的？", "响着警笛"], ["先做什么？", "接好水管"], ["再做什么？", "架上梯子"], ["最后做什么？", "爬上去救人"]], "h": "三步顺序，是交通类最典型的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "22", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉记忆", "s": "妈妈带我去外婆家，坐 3 路公交车。我们在第二站上车，坐了四站才到，车上人多，我把座位让给了老爷爷。", "qa": [["坐的是几路车？", "3 路"], ["在第几站上车？", "第二站"], ["一共坐了几站？", "四站"], ["我把座位让给了谁？", "老爷爷"]], "h": "站数容易记混，让他用手指点着数。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "23", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉顺序", "s": "爸爸的车快没油了。他先开到加油站，停在加油机旁边，打开油箱盖，加了两百块钱的油，最后进去付钱。", "qa": [["车为什么去加油站？", "快没油了"], ["车停在哪里？", "加油机旁边"], ["加了多少油？", "两百块钱"], ["最后去做什么？", "进去付钱"]], "h": "四步加一个数字，是偏难的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "24", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉顺序", "s": "自行车骑到半路链条掉了。爸爸把链条挂回齿轮上，用抹布擦掉手上的油，又试着骑了一圈。", "qa": [["自行车怎么了？", "链条掉了"], ["爸爸先做什么？", "把链条挂回齿轮"], ["用什么擦手？", "抹布"], ["最后做什么？", "试骑一圈"]], "h": "「齿轮」陌生就指着自行车解释一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "25", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉顺序", "s": "妈妈带我坐地铁：先坐二号线三站，在换乘站下车，走了一段很长的通道，再换四号线坐四站。", "qa": [["先坐几号线？", "二号线"], ["坐了几站？", "三站"], ["在哪里换乘？", "换乘站"], ["换乘后又坐几站？", "四站"]], "h": "两条线两个站数，是全档最绕的几张之一。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "26", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉理解", "s": "卡车把一车西瓜从乡下运到城里。路上颠了一下掉了两个，滚到路边，司机停下车把它们捡回来。", "qa": [["运的是什么？", "西瓜"], ["从哪里运到哪里？", "从乡下到城里"], ["掉了几个？", "两个"], ["司机怎么做的？", "停车捡回来"]], "h": "「颠了一下」是原因，问「为什么掉」时用得上。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "27", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉顺序", "s": "飞机起飞前，广播让大家先系好安全带，再收起小桌板，最后关上手机。都做好了，飞机才慢慢滑出去。", "qa": [["先做什么？", "系好安全带"], ["然后收起什么？", "小桌板"], ["最后关掉什么？", "手机"], ["都做好以后才怎么样？", "滑出去"]], "h": "三件事有固定顺序，是练听指令的好材料。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "28", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉理解", "s": "下雨天打不到车，我在路边招了半天手。司机说前面堵车要绕远路，我只好同意，结果还是迟到了。", "qa": [["什么天气打不到车？", "下雨天"], ["司机为什么要绕路？", "前面堵车"], ["我同意了吗？", "同意了"], ["最后迟到了吗？", "迟到了"]], "h": "「半天」是夸张，理解成「很久」就对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "29", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉理解", "s": "洒水车开过会放音乐。听见音乐我就躲到路边，因为它会把水洒到人身上；洒过的地方灰尘就不飞了。", "qa": [["洒水车开过时会怎样？", "放音乐"], ["听见音乐要做什么？", "躲到路边"], ["为什么要躲？", "会洒到身上"], ["洒过水灰尘怎么样？", "不飞了"]], "h": "「为什么」有两层，答出一层就算过。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "30", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 3, "ab": "听觉记忆", "s": "快递员上午送了十八件，下午送了二十一件。最后一趟电梯坏了，他爬了六层楼才送到，客户给他倒了杯水。", "qa": [["上午送了几件？", "十八件"], ["下午送了几件？", "二十一件"], ["为什么爬楼？", "电梯坏了"], ["客户做了什么？", "给他倒了杯水"]], "h": "两个数字不要求相加，听清就行。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "31", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "上个月我们搬家。先把书装箱，再拆床，然后请大车把东西拉到新房，最后花两天把箱子一个个打开。", "qa": [["先做什么？", "把书装箱"], ["再拆什么？", "床"], ["用什么拉东西？", "搬家公司的车"], ["花了几天开箱？", "两天"]], "h": "四个步骤加一个时间，是全套里较难的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "32", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉理解", "s": "晚上突然停电，屋里一片黑。我摸到门口抽屉找到手电筒，照亮以后妈妈才找到蜡烛，等了一小时才来电。", "qa": [["为什么屋里黑了？", "停电了"], ["手电筒在哪里找到的？", "门口抽屉"], ["谁找到的蜡烛？", "妈妈"], ["等了多久才来电？", "一小时"]], "h": "三个顺序加一个时间，是本档重点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "33", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉理解", "s": "妈妈的手机找不到了。她先翻了包，又看了茶几，最后我用她的手机打了个电话，铃声从沙发垫子里传出来。", "qa": [["谁手机不见了？", "妈妈"], ["她先翻了哪里？", "包"], ["又看了哪里？", "茶几"], ["铃声从哪里传来？", "沙发垫子里"]], "h": "最后一问最有趣，答出来说明他一路跟住了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "34", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "厨房水槽不下水了。爸爸拆开下面的弯管，掏出一团菜叶，再接回去，水就流下去了，他说以后别往里面倒菜汤。", "qa": [["水槽怎么了？", "不下水了"], ["爸爸拆开什么？", "下面的弯管"], ["掏出什么？", "一团菜叶"], ["最后他说了什么？", "别往里倒菜汤"]], "h": "「弯管」可以指着水槽下面解释。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "35", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "换灯泡要先拉下电闸，再搬椅子站上去，拧下旧灯泡装上新灯泡，最后把电闸推上去。", "qa": [["第一步做什么？", "拉下电闸"], ["为什么要拉电闸？", "防止触电"], ["拧下旧的以后装什么？", "新灯泡"], ["最后做什么？", "推上电闸"]], "h": "首尾两步最关键：拉闸、推闸。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "36", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 3, "ab": "听觉顺序", "s": "妈妈把洗好的衣服晾在阳台。忽然下雨，她先收袜子，再收衬衫，最后收床单，还是淋湿了一点。", "qa": [["衣服晾在哪里？", "阳台"], ["为什么赶紧收？", "下雨了"], ["先收什么？", "袜子"], ["最后收什么？", "床单"]], "h": "三件东西的顺序，答对两个就算好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\
