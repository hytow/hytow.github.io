<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>听觉训练卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F4F3EF;color:#1a1a1a;
  max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  overflow:hidden;overscroll-behavior:none;position:relative}
.top{flex:none;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 10px}
.tag{font-size:12px;font-weight:600;color:#fff;border-radius:999px;padding:4px 10px;letter-spacing:.5px;white-space:nowrap}
.lv{display:none}
.sp{flex:1}
.sel{font-size:13px;color:#55524b;background:#fff;border:1px solid #e6e4dd;border-radius:999px;
  padding:6px 10px;font-family:inherit}
.sel.wide{width:100%;max-width:100%;display:block}
.top2{flex:none;padding:0 14px 6px}
.lvdesc{flex:none;padding:0 16px 8px;font-size:11.5px;color:#a8a59d;line-height:1.5}
.chips{display:flex;gap:5px}
.chips .chip{padding:5px 9px;font-size:12px;line-height:1}
.chips .chip.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

.pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 10px}
.card{background:#fff;border-radius:20px;padding:22px 20px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px}
.art{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.art svg{width:60px;height:60px}
.story{font-size:20px;line-height:1.85;letter-spacing:.3px;text-align:justify}
.divider{height:1px;background:#efeee9;margin:18px 0 12px}
.lab{font-size:11px;font-weight:700;letter-spacing:2px;color:#b0ada4;margin-bottom:8px}
.qa{padding:11px 0;border-bottom:1px solid #f2f1ec}
.qa:last-child{border-bottom:none;padding-bottom:0}
.qrow{display:flex;gap:9px;align-items:flex-start}
.num{flex:none;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.qtext{flex:1;font-size:16.5px;line-height:1.55}
.ans{margin:6px 0 0 29px;font-size:14.5px;line-height:1.5;color:#fff;border-radius:8px;
  max-height:0;overflow:hidden;opacity:0;transition:.2s}
.qa.open .ans{max-height:80px;opacity:1;padding:5px 10px}
.hint{margin-top:12px;font-size:12.5px;line-height:1.6;color:#8b887f;background:#FAF9F5;border-radius:10px;padding:10px 12px}

.set{background:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;
  align-items:center;gap:8px;font-size:12.5px;color:#7d7a72}
.set .k{font-weight:600;color:#55524b;margin-right:2px}
.chip{border:1px solid #e6e4dd;background:#FBFAF6;border-radius:999px;padding:5px 11px;
  font-size:12.5px;color:#55524b;font-family:inherit}
.chip.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

.bar{flex:none;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:#fff;
  border-top:1px solid #eceae4;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:13px;font-size:15px;font-weight:600;padding:13px 0;
  font-family:inherit;letter-spacing:.5px;transition:.12s}
.btn:active{transform:scale(.97)}
.b-main{background:#1a1a1a;color:#fff}
.b-sub{background:#F2F1EC;color:#55524b}
.b-go{background:#1a1a1a;color:#fff;font-size:16px}
.b-th{background:var(--tc,#1a1a1a);color:#fff}

/* ---------- 提问模式 ---------- */
.quiz{flex:1;display:none;flex-direction:column;padding:0 16px}
.quiz.on{display:flex}
.qhead{flex:none;display:flex;align-items:center;gap:6px;padding:6px 0 14px}
.dot{width:26px;height:4px;border-radius:2px;background:#e2e0d9}
.dot.done{background:var(--tc,#1a1a1a)}
.dot.now{background:var(--tc,#1a1a1a);opacity:.55}
.sg{margin-left:auto;border:1px solid #e6e4dd;background:#fff;border-radius:999px;
  font-size:12px;color:#55524b;padding:5px 11px;font-family:inherit}
.storybox{display:none;font-size:15.5px;line-height:1.75;color:#3f3c36;background:#fff;
  border-radius:14px;padding:13px 15px;margin:0 0 10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.storybox.on{display:block}
.tip{font-size:12px;color:#a8a59d;text-align:center;padding:12px 0 4px;line-height:1.6}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:0 6px}
.qno{font-size:12px;letter-spacing:3px;color:#b0ada4;margin-bottom:14px}
.qbig{font-size:30px;line-height:1.6;font-weight:500;letter-spacing:.5px}
.abig{margin-top:22px;font-size:23px;line-height:1.5;color:#fff;background:var(--tc,#1a1a1a);
  border-radius:14px;padding:14px 20px;opacity:0;transform:translateY(6px);transition:.25s}
.abig.on{opacity:1;transform:none}
.qfoot{flex:none;padding:14px 0 6px}
.timerwrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tbar{flex:1;height:6px;border-radius:3px;background:#e8e6df;overflow:hidden}
.tfill{height:100%;width:100%;background:var(--tc,#1a1a1a);border-radius:3px}
.tnum{font-size:13px;color:#9b988f;font-variant-numeric:tabular-nums;width:34px;text-align:right}
.sthint{font-size:12px;color:#a8a59d;text-align:center;padding-bottom:8px;line-height:1.5}
</style>
</head>
<body>

<div class="top">
  <span class="tag" id="tag">—</span>
  <span class="sp"></span>
  <div class="chips" id="lvchips">
    <button class="chip" data-l="0">全部</button>
    <button class="chip on" data-l="1">★</button>
    <button class="chip" data-l="2">★★</button>
    <button class="chip" data-l="3">★★★</button>
  </div>
</div>
<div class="top2">
  <select class="sel wide" id="jump"></select>
</div>
<div class="lvdesc" id="lvdesc"></div>

<div class="pane" id="pane">
  <div class="card">
    <div class="story" id="story"></div>
    <div class="divider"></div>
    <div class="lab">四 个 问 题</div>
    <div id="qalist"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="set">
    <span class="k">每题停留</span>
    <button class="chip" data-s="20">20 秒</button>
    <button class="chip on" data-s="30">30 秒</button>
    <button class="chip" data-s="45">45 秒</button>
    <button class="chip" data-s="60">60 秒</button>
  </div>
  <div class="tip"><span id="count"></span>　·　点问题展开答案　·　右上角可跳转</div>
</div>

<div class="quiz" id="quiz">
  <div class="qhead"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <button class="sg" id="sg">看故事</button>
  </div>
  <div class="storybox" id="storybox"></div>
  <div class="qbody">
    <div class="qno" id="qno">第 1 题</div>
    <div class="qbig" id="qbig"></div>
    <div class="abig" id="abig"></div>
  </div>
  <div class="qfoot">
    <div class="timerwrap">
      <div class="tbar"><div class="tfill" id="tfill"></div></div>
      <div class="tnum" id="tnum">30s</div>
    </div>
    <div class="sthint" id="sthint"></div>
    <div class="row">
      <button class="btn b-sub" id="reveal">看答案</button>
      <button class="btn b-th" id="nextq">下一题</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn b-sub" id="quit">结束提问</button>
    </div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="row">
    <button class="btn b-sub" id="prev">上一张</button>
    <button class="btn b-go" id="start">开始提问</button>
    <button class="btn b-sub" id="next">下一张</button>
  </div>
</div>

<script>
const CARDS = [{"no": "01", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "小白兔在院子里吃萝卜，一次吃了三根。", "qa": [["谁在吃萝卜？", "小白兔"], ["在哪里吃？", "院子里"], ["吃的是什么？", "萝卜"], ["吃了几根？", "三根"]], "h": "四个答案都在话里，答错就是没听清，重念一遍。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "02", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "小狗趴在门口，听见脚步声就抬起头。", "qa": [["谁趴在门口？", "小狗"], ["它趴在哪里？", "门口"], ["听见什么就抬头？", "脚步声"], ["它抬起头了吗？", "抬了"]], "h": "最后一问换个说法，看他是不是真听懂了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "03", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "小鸭子在池塘里游，游到荷叶边上停下来。", "qa": [["谁在游？", "小鸭子"], ["在哪里游？", "池塘里"], ["游到哪里停下？", "荷叶边上"], ["它停下来了吗？", "停了"]], "h": "「荷叶边上」是位置，答「荷叶旁边」也对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "04", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "小花猫爬上屋顶，蹲在烟囱旁边晒太阳。", "qa": [["谁爬上屋顶？", "小花猫"], ["它爬上哪里？", "屋顶"], ["蹲在什么旁边？", "烟囱"], ["它在做什么？", "晒太阳"]], "h": "屋顶、烟囱是两个位置，别混。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "05", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "大公鸡站在墙头上，天一亮就叫了三声。", "qa": [["谁站在墙头上？", "大公鸡"], ["它站在哪里？", "墙头"], ["什么时候叫？", "天一亮"], ["叫了几声？", "三声"]], "h": "四个点都明说，重点是「三声」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "06", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "小松鼠抱着一个松果，跑到树洞前面停下来。", "qa": [["谁抱着松果？", "小松鼠"], ["抱着什么？", "松果"], ["跑到哪里？", "树洞前面"], ["它停下来了吗？", "停了"]], "h": "「抱」和「跑」是两个动作，都听到了才算好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "07", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "老黄牛在田里走，走得很慢。", "qa": [["谁在田里走？", "老黄牛"], ["在哪里走？", "田里"], ["它走得快还是慢？", "慢"], ["它在做什么？", "走路"]], "h": "这题最简单，答对就大声夸。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "08", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "小鸟叼着一根草，飞回窝里喂小宝宝。", "qa": [["谁叼着一根草？", "小鸟"], ["叼着什么？", "一根草"], ["飞回哪里？", "窝里"], ["回去做什么？", "喂小宝宝"]], "h": "「叼」这个动作可以让他学一下。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "09", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "小鱼躲在水草后面，一动不动。", "qa": [["谁躲在水草后面？", "小鱼"], ["躲在哪里？", "水草后面"], ["它动了吗？", "一动没动"], ["它为什么躲？", "怕被发现"]], "h": "最后一问是猜的，答「躲起来」就行。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "10", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "小猪吃饱了，躺在稻草上打呼噜。", "qa": [["谁躺在稻草上？", "小猪"], ["它吃饱了没有？", "吃饱了"], ["躺在哪里？", "稻草上"], ["它在做什么？", "打呼噜睡觉"]], "h": "让他学一下呼噜声，这题会变得很好玩。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "11", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "桌上有一个红苹果，妈妈把它切成四块。", "qa": [["桌上有什么？", "一个红苹果"], ["苹果是什么颜色？", "红色"], ["谁切的？", "妈妈"], ["切成几块？", "四块"]], "h": "「四块」是数字点，让他掰手指数。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "12", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉记忆", "s": "香蕉黄黄的、弯弯的，一共五根。", "qa": [["香蕉是什么颜色？", "黄色"], ["它是什么样子？", "弯弯的"], ["一共有几根？", "五根"], ["香蕉是水果吗？", "是"]], "h": "颜色、形状、数量三个点，答两个就不错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "13", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "西瓜切开是红瓤，里面有很多黑籽。", "qa": [["西瓜切开是什么颜色？", "红色"], ["里面有什么？", "黑籽"], ["籽是什么颜色？", "黑色"], ["西瓜是水果吗？", "是"]], "h": "红瓤黑籽，两个颜色都要听准。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "14", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "草莓长在地上，身上有小点点。", "qa": [["草莓长在哪里？", "地上"], ["它身上有什么？", "小点点"], ["草莓是大还是小？", "小"], ["它是水果吗？", "是"]], "h": "「长在地上」是草莓的特点，和苹果不一样。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "15", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉记忆", "s": "一串葡萄挂在架子上，紫紫的。", "qa": [["什么挂在架子上？", "一串葡萄"], ["挂在哪里？", "架子上"], ["葡萄是什么颜色？", "紫色"], ["有几串？", "一串"]], "h": "「一串」不是「一颗」，注意听。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "16", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "橘子皮是橙色的，剥开有十瓣。", "qa": [["橘子皮是什么颜色？", "橙色"], ["剥开有几瓣？", "十瓣"], ["要剥开才能吃吗？", "要"], ["橘子甜不甜？", "甜"]], "h": "最后一问是常识，答什么都行，主要在「十瓣」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "17", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "桃子圆圆的，皮上有一层毛毛。", "qa": [["桃子是什么形状？", "圆形"], ["皮上有什么？", "一层毛毛"], ["吃什么水果要去毛？", "桃子"], ["桃子是什么颜色？", "粉红色"]], "h": "最后一问话里没说，答「粉的/红的」都对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "18", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉记忆", "s": "梨是黄色的，咬一口很甜。", "qa": [["梨是什么颜色？", "黄色"], ["咬一口什么味道？", "甜"], ["梨是水果吗？", "是"], ["梨和苹果哪个大？", "差不多"]], "h": "最后一问比较开放，答什么都可以。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "19", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉理解", "s": "菜市场里有黄瓜、西红柿和白菜。", "qa": [["菜市场里有什么？", "黄瓜、西红柿、白菜"], ["有几种菜？", "三种"], ["哪一种是红色的？", "西红柿"], ["哪一种是白色的？", "白菜"]], "h": "三种菜一起记，说两种也算好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "20", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 1, "ab": "听觉记忆", "s": "妈妈把苹果和胡萝卜放进榨汁机。", "qa": [["妈妈放了什么？", "苹果和胡萝卜"], ["放进哪里？", "榨汁机"], ["放了几样东西？", "两样"], ["榨出来是什么？", "果汁"]], "h": "两样东西是重点，「胡萝卜」容易漏。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "21", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 1, "ab": "听觉理解", "s": "爸爸骑摩托车带我上街，我坐在后面。", "qa": [["爸爸骑什么？", "摩托车"], ["我们去哪里？", "上街"], ["我坐在哪里？", "后面"], ["谁在骑车？", "爸爸"]], "h": "「后面」是位置点，和「前面」要分清。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "22", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 1, "ab": "听觉理解", "s": "公交车来了，我们从前门上车。", "qa": [["什么车来了？", "公交车"], ["我们从哪个门上？", "前门"], ["我们去哪里？", "车上"], ["公交车大不大？", "大"]], "h width=\"3\"/>\n</svg>"}, {"no": "27", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 1, "ab": "听觉理解", "s": "自行车的轮子有两个，铃铛一按就响。", "qa": [["自行车有几个轮子？", "两个"], ["什么一按就响？", "铃铛"], ["铃铛的声音是什么？", "叮叮"], ["自行车要用脚蹬吗？", "要"]], "h": "两个轮子最容易答成三个，注意。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "28", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 1, "ab": "听觉记忆", "s": "校车是黄色的，每天早上来接小朋友。", "qa": [["校车是什么颜色？", "黄色"], ["它什么时候来？", "每天早上"], ["它来接谁？", "小朋友"], ["校车是干什么用的？", "接小朋友上幼儿园"]], "h": "颜色加时间，两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "29", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 1, "ab": "听觉理解", "s": "洒水车开过去，地上湿了一片。", "qa": [["什么车开过去？", "洒水车"], ["地上变成了什么样？", "湿了一片"], ["它洒的是什么？", "水"], ["洒水车是什么颜色？", "绿色"]], "h": "最后一问话里没说，答什么都行。", "ic": "<svg viewBox=\"0 0 100 100\" xmln "/>\n</svg>"}, {"no": "34", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉理解", "s": "我的小床靠着窗户，床头有一盏灯。", "qa": [["小床靠着什么？", "窗户"], ["床头有什么？", "一盏灯"], ["灯在哪里？", "床头"], ["小床靠着门吗？", "不靠"]], "h": "「靠着窗户」是位置点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "35", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉记忆", "s": "我不小心把杯子摔了，碎成三块。", "qa": [["我把什么摔了？", "杯子"], ["是怎么摔的？", "不小心"], ["碎成几块？", "三块"], ["杯子是玻璃的吗？", "是"]], "h": "「三块」是数字点，「不小心」是原因点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "36", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉理解", "s": "门口放着两双拖鞋，一双红的，一双灰的。", "qa": [["门口放着几双拖鞋？", "两双"], ["有哪两种颜色？", "红色和灰色"], ["一共有几只拖鞋？", "四只"], ["拖鞋放在哪里？", "门口"]], "h": "两双是四只，最后一问要转一下。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "37", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉理解", "s": "爷爷的椅子只有三条腿，一坐就晃。", "qa": [["椅子有几条腿？", "三条"], ["坐上去会怎么样？", "晃"], ["是谁的椅子？", "爷爷的"], ["椅子稳不稳？", "不稳"]], "h": "三条腿是关键，孩子容易答四条。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "38", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉记忆", "s": "阳台上有三盆花，两盆是绿萝。", "qa": [["阳台上有几盆花？", "三盆"], ["有几盆绿萝？", "两盆"], ["花放在哪里？", "阳台上"], ["还有一盆不是绿萝，对吗？", "对"]], "h": "三和二是两个数字，容易串。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "39", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉理解", "s": "冰箱上层放着牛奶和鸡蛋。", "qa": [["冰箱上层放着什么？", "牛奶和鸡蛋"], ["放在哪一层？", "上层"], ["牛奶放在哪里？", "冰箱上层"], ["鸡蛋放在冰箱里吗？", "放"]], "h": "「上层」是位置点，别答成下层。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "40", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 1, "ab": "听觉记忆", "s": "浴室里有白色的浴缸和蓝色的毛巾。", "qa": [["浴室里有什么？", "浴缸和毛巾"], ["浴缸是什么颜色？", "白色"], ["毛巾是什么颜色？", "蓝色"], ["毛巾挂在哪里？", "浴室里"]], "h": "两个颜色对应两个东西，是本档的考点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "41", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "我有两只眼睛，能看见颜色。", "qa": [["我有几只眼睛？", "两只"], ["眼睛能看见什么？", "颜色"], ["眼睛长在哪里？", "脸上"], ["闭上眼睛还能看见吗？", "不能"]], "h": "最后一问是反着的，答「不能」就对了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "42", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉记忆", "s": "耳朵有两只，一边一只。", "qa": [["耳朵有几只？", "两只"], ["它们长在哪里？", "头两边"], ["一边有几只？", "一只"], ["耳朵能听声音吗？", "能"]], "h": "「一边一只」是位置加数量。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "43", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "鼻子长在脸中间，能闻到香味。", "qa": [["鼻子长在哪里？", "脸中间"], ["鼻子有几个？", "一个"], ["鼻子能闻到什么？", "香味"], ["鼻子能看见东西吗？", "不能"]], "h": "最后一问是排除，考他有没有听清功能。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "44", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "嘴巴能吃饭，也能说话。", "qa": [["嘴巴能做什么？", "吃饭和说话"], ["嘴巴有几个？", "一个"], ["说话用什么？", "嘴巴"], ["嘴巴长在哪里？", "脸上"]], "h": "两个功能是重点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "45", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉记忆", "s": "每只手有五个手指。", "qa": [["每只手有几个手指？", "五个"], ["两只手一共几个？", "十个"], ["手指长在哪里？", "手上"], ["最短的是哪个？", "小拇指"]], "h": "五和十，最后一问要算。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "46", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "脚上穿着鞋，走路跑步都用它。", "qa": [["脚上穿着什么？", "鞋"], ["走路用什么？", "脚"], ["跑步用什么？", "脚"], ["人有几只脚？", "两只"]], "h": "三个问题其实是一个意思，考的是稳不稳。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "47", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "我六岁，已经掉了一颗门牙。", "qa": [["我几岁？", "六岁"], ["我掉了什么？", "一颗门牙"], ["掉了几颗？", "一颗"], ["掉的是哪颗牙？", "门牙"]], "h": "「一颗」和「门牙」两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "48", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉记忆", "s": "我的头发黑黑的、长长的。", "qa": [["我的头发是什么颜色？", "黑色"], ["头发是长还是短？", "长"], ["头发长在哪里？", "头上"], ["头发会一直长吗？", "会"]], "h": "颜色加长短，两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fill=\"#F4C0D1\" stroke=\"#993556\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M48 46 V38 M58 44 V38 M68 50 V44\" stroke=\"#993556\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "49", "t": "body", "tn": "身体部位", "c": "#993556", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "我摔了一跤，膝盖破了皮。", "qa": [["我怎么了？", "摔了一跤"], ["哪里破了皮？", "膝盖"], ["膝盖在哪里？", "腿上"], ["破了皮疼不疼？", "疼"]], "h": "膝盖这个部位容易和胳膊肘混。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M38 78 V46 Q38 40 43 40 Q48 40 48 46 V38 Q48 32 53 32 Q58 32 58 38 V44 Q58 38 63 38 Q68 38 68 44 V50 Q68 44 73 44 Q78 44 78 50 V70 Q78 84 63 86 H50 Q38 84 38 78 Z\" fi th=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "53", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "下雪了，地上白白的、软软的。", "qa": [["下雪了地上是什么颜色？", "白色"], ["踩上去什么感觉？", "软软的"], ["雪是什么做的？", "水"], ["下雪冷不冷？", "冷"]], "h": "颜色加触感，两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "54", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "今天刮大风，我的帽子被吹跑了。", "qa": [["今天刮什么风？", "大风"], ["什么被吹跑了？", "帽子"], ["帽子是被什么吹跑的？", "风"], ["风大还是小？", "大"]], "h": "三问其实是一件事，考他抓不抓得住。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "55", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "天上有几朵白云，像一团棉花。", "qa": [["天上有什么？", "白云"], ["白云是什么颜色？", "白色"], ["白云像什么？", "棉花"], ["有几朵？", "几朵"]], "h": "「几朵」是模糊数，答「几朵」就对了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "56", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "早上草叶上有露水，亮亮的。", "qa": [["草叶上有什么？", "露水"], ["它是什么样子的？", "亮亮的"], ["什么时候有露水？", "早上"], ["太阳出来以后会怎么样？", "不见了"]], "h": "最后一问要推一下，答不出就提示。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "57", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "傍晚西边的天红红的，那是晚霞。", "qa": [["什么时候有晚霞？", "傍晚"], ["晚霞在天哪一边？", "西边"], ["晚霞是什么颜色？", "红红的"], ["晚霞在早上有吗？", "没有"]], "h": "傍晚加西边，两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "58", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "冬天水盆里的水结成了冰。", "qa": [["什么季节水会结冰？", "冬天"], ["水盆里的水变成了什么？", "冰"], ["冰摸上去怎么样？", "凉凉的"], ["冰是硬的吗？", "是"]], "h": "季节加变化，是本档典型结构。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "59", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉理解", "s": "春天来了，柳树冒出小芽。", "qa": [["什么季节来了？", "春天"], ["什么树冒出小芽？", "柳树"], ["小芽长在哪里？", "树上"], ["春天后面是什么季节？", "夏天"]], "h": "最后一问是顺序，答不出就提示。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "60", "t": "sky", "tn": "天气季节", "c": "#185FA5", "bg": "#E6F1FB", "l": 1, "ab": "听觉记忆", "s": "夏天很热，中午的太阳最晒。", "qa": [["夏天天气怎么样？", "很热"], ["什么时候太阳最晒？", "中午"], ["夏天要穿厚衣服吗？", "不用"], ["夏天会下雪吗？", "不会"]], "h": "两个反着问的题，答对说明真听懂。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<g stroke=\"#185FA5\" stroke-width=\"3\" stroke-linecap=\"round\">\n<path d=\"M50 14 V24\"/><path d=\"M50 76 V86\"/><path d=\"M14 50 H24\"/><path d=\"M76 50 H86\"/>\n<path d=\"M25 25 L32 32\"/><path d=\"M68 68 L75 75\"/><path d=\"M75 25 L68 32\"/><path d=\"M32 68 L25 75\"/>\n</g>\n</svg>"}, {"no": "61", "t": "school", "tn": "幼儿园", "c": "#534AB7", "bg": "#EEEDFE", "l": 1, "ab": "听觉理解", "s": "我的书包是绿色的，里面有一本图画书。", "qa": [["书包是什么颜色？", "绿色"], ["里面有什么？", "一本图画书"], ["有几本书？", "一本"], ["书包是谁的？", "我的"]], "h": "颜色加物品，两个点。",  {"no": "87", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 1, "ab": "听觉记忆", "s": "小河从山上流下来，水很清。", "qa": [["小河从哪里流下来？", "山上"], ["水清不清？", "很清"], ["小河往哪里流？", "往下流"], ["河里有鱼吗？", "有"]], "h": "「从山上」是起点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "88", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 1, "ab": "听觉理解", "s": "秋天树叶落了一地，有的黄有的红。", "qa": [["什么季节树叶落下？", "秋天"], ["树叶有哪两种颜色？", "黄色和红色"], ["树叶落在哪里？", "地上"], ["落得多不多？", "落了一地"]], "h": "两个颜色是这题的考点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "89", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 1, "ab": "听觉记忆", "s": "晚上天上的星星一闪一闪。", "qa": [["什么时候能看见星星？", "晚上"], ["星星在哪里？", "天上"], ["星星是什么样的？", "一闪一闪"], ["白天能看见星星吗？", "看不见"]], "h": "最后一问和之前的「白天看不见」呼应。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "90", "t": "nature", "tn": "大自然", "c": "#3B6D11", "bg": "#EAF3DE", "l": 1, "ab": "听觉理解", "s": "山上有一条小路，一直通到山顶。", "qa": [["山上有什么？", "一条小路"], ["小路通到哪里？", "山顶"], ["有几条小路？", "一条"], ["小路宽不宽？", "不宽"]], "h": "「一条」加「山顶」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"45\" y=\"62\" width=\"10\" height=\"26\" rx=\"3\" fill=\"#3B6D11\" opacity=\"0.55\"/>\n<circle cx=\"50\" cy=\"44\" r=\"26\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"3\"/>\n<circle cx=\"34\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n<circle cx=\"66\" cy=\"30\" r=\"13\" fill=\"#C0DD97\" stroke=\"#3B6D11\" stroke-width=\"2.6\"/>\n</svg>"}, {"no": "91", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "三只小猪盖房子，老大用稻草，老二用木头，老三用砖头。", "qa": [["谁在盖房子？", "三只小猪"], ["老大用什么？", "稻草"], ["老二用什么？", "木头"], ["老三用什么？", "砖头"]], "h": "三个人三种材料，是本档的典型结构。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "92", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉顺序", "s": "老爷爷拔萝卜，拔不动，叫来老奶奶一起拔。", "qa": [["谁在拔萝卜？", "老爷爷"], ["他拔得动吗？", "拔不动"], ["他叫来谁？", "老奶奶"], ["后来拔出来了吗？", "拔出来了"]], "h": "「拔不动」是关键，别答成拔出来了。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "93", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "龟兔赛跑，兔子跑到一半就睡着了。", "qa": [["谁和谁赛跑？", "乌龟和兔子"], ["兔子跑了一半做什么？", "睡觉"], ["兔子跑得快吗？", "快"], ["谁赢了？", "乌龟"]], "h": "最后一问话里没说，但孩子基本都知道。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "94", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "小马要过河，它自己试了试水的深浅。", "qa": [["小马要做什么？", "过河"], ["它自己试了什么？", "水的深浅"], ["它试了才知道什么？", "水有多深"], ["它过河了吗？", "过了"]], "h": "「自己试」是这故事的理。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "95", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉记忆", "s": "小红帽去看外婆，带了一篮点心。", "qa": [["小红帽去看谁？", "外婆"], ["她带了什么？", "一篮点心"], ["带了多少？", "一篮"], ["她要去哪里？", "外婆家"]], "h": "人、东西、地点三个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "96", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "丑小鸭长大了，变成一只白天鹅。", "qa": [["谁长大了？", "丑小鸭"], ["它变成了什么？", "白天鹅"], ["白天鹅是什么颜色？", "白色"], ["它小时候好看吗？", "不好看"]], "h": "「白天鹅」是结果。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "97", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "放羊的孩子喊狼来了，前两次都是假的。", "qa": [["谁在喊狼来了？", "放羊的孩子"], ["喊了几次？", "两次"], ["狼真的来了吗？", "没有"], ["后来说的话还有人信吗？", "没人信"]], "h": "最后一问是故事的教训。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "98", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉顺序", "s": "乌鸦口渴了，把石子一颗一颗叼进瓶子。", "qa": [["乌鸦为什么找水？", "口渴了"], ["它把什么叼进瓶子？", "石子"], ["怎么叼的？", "一颗一颗"], ["为什么叼石子？", "让水升高"]], "h": "「一颗一颗」是细节。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "99", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "狐狸够不着葡萄，说葡萄是酸的。", "qa": [["狐狸想吃什么？", "葡萄"], ["它够得着吗？", "够不着"], ["它说葡萄是什么味道？", "酸的"], ["葡萄真的是酸的吗？", "不一定"]], "h": "最后一问很有趣，孩子常会笑。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "100", "t": "story", "tn": "童话故事", "c": "#72243E", "bg": "#FBEAF0", "l": 1, "ab": "听觉理解", "s": "猴子在井边看见月亮，伸手去捞。", "qa": [["猴子在哪里看见月亮？", "井边"], ["它想做什么？", "捞月亮"], ["井里的月亮是真的吗？", "不是"], ["它捞到了吗？", "没捞到"]], "h": "「井里的月亮是影子」可以等他自己说。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M20 84 V46 H30 V38 H38 V46 H46 V38 H54 V46 H62 V38 H70 V46 H80 V84 Z\" fill=\"#ED93B1\" stroke=\"#72243E\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M44 84 V66 Q44 58 50 58 Q56 58 56 66 V84\" fill=\"#fff\" stroke=\"#72243E\" stroke-width=\"2.6\"/>\n<path d=\"M50 20 L54 30 H46 Z\" fill=\"#72243E\"/>\n<path d=\"M50 10 V20\" stroke=\"#72243E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n</svg>"}, {"no": "01", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉理解", "s": "小狗把骨头埋在院子里的大树下面。第二天去挖，只挖出一块石头。", "qa": [["骨头埋在哪里？", "大树下面"], ["第二天它去做什么？", "挖骨头"], ["挖出来什么？", "一块石头"], ["骨头找到了吗？", "没有"]], "h": "最后一问是反问，孩子容易顺口答「找到了」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "02", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉记忆", "s": "小兔子有五个胡萝卜，送给小羊两个，自己留下三个。", "qa": [["小兔子有几个胡萝卜？", "五个"], ["送给谁两个？", "小羊"], ["自己留下几个？", "三个"], ["一共送出去几个？", "两个"]], "h": "五个、两个、三个，三个数字容易串。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "03", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉顺序", "s": "小鸟早上在树上唱歌，中午下起雨来，它躲到一片大叶子下面。", "qa": [["小鸟早上在做什么？", "在树上唱歌"], ["什么时候下雨？", "中午"], ["它躲到哪里？", "大叶子下面"], ["它本来在哪里唱歌？", "树上"]], "h": "时间点「早上—中午」是这题的关键。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "04", "t": "animal", "tn": "动物朋友", "c": "#185FA5", "bg": "#E6F1FB", "l": 2, "ab": "听觉记忆", "s": "天还没亮，大公鸡站上墙头叫了三声，全村的人都醒了。", "qa": [["谁站在墙头上？", "大公鸡"], ["叫了几声？", "三声"], ["谁被叫醒了？", "全村的人"], ["是什么时候叫的？", "天没亮"]], "h": "「三声」加上「天没亮」，两个点一起记。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"50\" cy=\"58\" r=\"23\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/>\n<path d=\"M31 41 L26 20 L45 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M69 41 L74 20 L55 32\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 ircle cx=\"42\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/><circle cx=\"58\" cy=\"55\" r=\"3\" fill=\"#185FA5\"/>\n<path d=\"M46 66 Q50 70 54 66\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n<path d=\"M20 60 H33 M20 66 H33 M67 60 H80 M67 66 H80\" stroke=\"#185FA5\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n</svg>"}, {"no": "11", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "荔枝的壳是红的，上面有小疙瘩，剥开里面是白果肉和一颗黑核。", "qa": [["荔枝壳是什么颜色？", "红色"], ["壳上有什么？", "小疙瘩"], ["果肉是什么颜色？", "白色"], ["中间有什么？", "一颗黑核"]], "h": "壳、肉、核三层，是本主题的典型结构。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "12", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "葡萄晒干就变成葡萄干，比原来小，也比原来甜，抓一把能装一小袋。", "qa": [["葡萄晒干变成什么？", "葡萄干"], ["比原来大还是小？", "小"], ["比原来甜还是酸？", "甜"], ["抓一把能装多少？", "一小袋"]], "h": "「变小」和「变甜」是两个变化。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "13", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "水果店门口摆着三箱水果：左边是橙子，中间是苹果，右边是梨。妈妈买了中间那箱。", "qa": [["门口摆了几箱？", "三箱"], ["左边是什么？", "橙子"], ["右边是什么？", "梨"], ["妈妈买了哪一箱？", "中间那箱"]], "h": "三个方位是考点，可以让他用手指着说。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "14", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉记忆", "s": "爸爸削苹果，皮一直没断。他把苹果切成八块，我吃了三块。", "qa": [["谁削的苹果？", "爸爸"], ["苹果皮断了没有？", "没断"], ["切成几块？", "八块"], ["我吃了几块？", "三块"]], "h": "八块和三块，两个数字容易混。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "15", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉顺序", "s": "做水果沙拉，先把苹果、香蕉、西瓜切成小块，再倒酸奶拌一拌，最后放葡萄干。", "qa": [["要切哪几种水果？", "苹果、香蕉、西瓜"], ["倒什么拌？", "酸奶"], ["最后放什么？", "葡萄干"], ["先做什么？", "切水果"]], "h": "三种水果一起记，说出两种也算好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "16", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "柚子皮很厚，要用刀划开一道口子，再一瓣一瓣剥，果肉是粉红色的。", "qa": [["柚子皮厚不厚？", "很厚"], ["用什么划开？", "刀"], ["怎么剥？", "一瓣一瓣用手剥"], ["果肉是什么颜色？", "粉红色"]], "h": "「划口子」和「剥」是两个动作。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "17", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "石榴皮硬硬的，掰开以后挤满亮晶晶的红籽，一颗一颗像小珠子。", "qa": [["石榴皮硬还是软？", "硬"], ["掰开以后是什么？", "红籽"], ["籽像什么？", "小珠子"], ["籽是什么颜色？", "红色"]], "h": "「像小珠子」是比喻，答不上来不算错。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "18", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉记忆", "s": "妈妈给我十块钱买苹果，一斤五块。我买了二斤，钱刚够。", "qa": [["妈妈给了多少钱？", "十块"], ["一斤多少钱？", "五块"], ["买了几斤？", "二斤"], ["还剩钱吗？", "没有"]], "h": "算不出来就提示「一斤五块，两斤呢」。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "19", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉理解", "s": "冰箱里的橘子放了三个星期，皮上长了一层白毛，妈妈让我扔进垃圾桶。", "qa": [["橘子放了多久？", "三个星期"], ["皮上长了什么？", "白毛"], ["还能吃吗？", "不能"], ["妈妈让我怎么做？", "扔进垃圾桶"]], "h": "顺势教一句：看着不对的东西先问大人。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "20", "t": "fruit", "tn": "水果蔬菜", "c": "#A32D2D", "bg": "#FCEBEB", "l": 2, "ab": "听觉记忆", "s": "我摘了八个草莓，洗干净，分给妹妹三个，自己留五个。", "qa": [["我摘了几个草莓？", "八个"], ["妹妹分了几个？", "三个"], ["自己留几个？", "五个"], ["草莓吃之前要做什么？", "洗干净"]], "h": "八、三、五，三个数字，是本题的难点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M50 30 C40 18 20 24 22 48 C24 68 38 82 50 82 C62 82 76 68 78 48 C80 24 60 18 50 30 Z\" fill=\"#F7C1C1\" stroke=\"#A32D2D\" stroke-width=\"3\"/>\n<path d=\"M50 30 V16\" stroke=\"#A32D2D\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<path d=\"M50 20 Q62 10 70 16 Q62 26 50 24\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/>\n</svg>"}, {"no": "21", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉顺序", "s": "着火了，消防车响着警笛冲过去。消防员先接好水管，再架梯子，最后爬楼救人。", "qa": [["消防车怎么去的？", "响着警笛冲过去"], ["先做什么？", "接好水管"], ["再做什么？", "架梯子"], ["最后做什么？", "爬楼救人"]], "h": "三步顺序，是交通类的典型题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "22", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉记忆", "s": "校车停在第三个路口，老师先下车，扶着小朋友一个一个走下来。", "qa": [["校车停在哪个路口？", "第三个"], ["谁先下车？", "老师"], ["小朋友怎么下车？", "一个一个"], ["老师下车做什么？", "扶着小朋友"]], "h": "「第三个」和「先下车」是两个点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "23", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉理解", "s": "卡车运一车西瓜，路上颠了一下掉了两个，司机停下车把它们捡回来。", "qa": [["卡车运的是什么？", "西瓜"], ["路上掉了几个？", "两个"], ["司机怎么做的？", "停车捡回来"], ["为什么掉的？", "路颠了一下"]], "h": "最后一问是原因，答「颠了一下」就对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "24", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉理解", "s": "骑摩托车一定要戴头盔，头盔护住脑袋，万一摔了才不会磕破头。", "qa": [["骑摩托车要戴什么？", "头盔"], ["头盔护住哪里？", "脑袋"], ["万一摔了会怎么样？", "头不会磕破"], ["不戴行不行？", "不行"]], "h": "安全题，答对要郑重肯定一句。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "25", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉顺序", "s": "飞机起飞前，广播先让大家系好安全带，再收起小桌板，最后关上手机。", "qa": [["先做什么？", "系好安全带"], ["然后收起什么？", "小桌板"], ["最后关掉什么？", "手机"], ["是谁提醒大家的？", "广播"]], "h": "三件事有固定顺序，正好练听指令。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "26", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉理解", "s": "火车卧铺有三层，我睡中间那层。妈妈说下面最方便，上面最安静。", "qa": [["卧铺有几层？", "三层"], ["我睡哪一层？", "中间那层"], ["哪层最方便？", "下面"], ["哪层最安静？", "上面"]], "h": "三句话三个人说，注意别串。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "27", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉顺序", "s": "过马路要看红绿灯：红灯停，绿灯行，黄灯等一等。我等绿灯才走。", "qa": [["红灯要怎么样？", "停"], ["绿灯要怎么样？", "行"], ["黄灯要怎么样？", "等一等"], ["我什么时候才走？", "绿灯"]], "h": "三个颜色三个动作，是经典题。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "28", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉理解", "s": "早上堵车了，前面一辆车停下，后面的车一辆接一辆跟着停。", "qa": [["早上路上怎么样？", "堵车"], ["最前面的车怎么了？", "停下了"], ["后面的车怎么样？", "一辆接一辆停下"], ["为什么会堵？", "前面的车停了"]], "h": "「一辆接一辆」是这题的形象点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "29", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉理解", "s": "我去少年宫应该坐五站，数错了，坐过两站，只好下车往回走。", "qa": [["我要去哪里？", "少年宫"], ["应该坐几站？", "五站"], ["坐过了几站？", "两站"], ["后来怎么做的？", "下车往回走"]], "h": "五站和两站，数字是考点。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "30", "t": "car", "tn": "交通工具", "c": "#0F6E56", "bg": "#E1F5EE", "l": 2, "ab": "听觉记忆", "s": "快递员上午送了十八件，下午送了二十一件，最后一趟电梯坏了，爬了六层楼。", "qa": [["上午送了几件？", "十八件"], ["下午送了几件？", "二十一件"], ["为什么爬楼？", "电梯坏了"], ["爬了几层？", "六层"]], "h": "三个数字，答对两个就算听得好。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"14\" y=\"30\" width=\"72\" height=\"42\" rx=\"8\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<rect x=\"22\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<rect x=\"48\" y=\"38\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"2.4\"/>\n<circle cx=\"32\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n<circle cx=\"68\" cy=\"78\" r=\"8\" fill=\"#fff\" stroke=\"#0F6E56\" stroke-width=\"3\"/>\n</svg>"}, {"no": "31", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "星期六打扫房间，我先把玩具收进箱子，妈妈再吸地，最后爸爸擦桌子。", "qa": [["先做什么？", "收玩具"], ["谁吸地？", "妈妈"], ["最后谁擦桌子？", "爸爸"], ["玩具收到哪里？", "箱子里"]], "h": "三个人三个动作，最容易串。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "32", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "换灯泡要先拉下电闸，再站上椅子，拧下旧的换上新的，最后推上电闸。", "qa": [["第一步做什么？", "拉下电闸"], ["为什么要拉电闸？", "防止触电"], ["最后做什么？", "推上电闸"], ["旧灯泡拧下来后装什么？", "新灯泡"]], "h": "第一步和最后一步是本题关键。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "33", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉理解", "s": "水龙头一直滴水，爸爸关掉总阀，换了一个小小的橡胶垫，就不滴了。", "qa": [["水龙头怎么了？", "一直滴水"], ["爸爸先做什么？", "关掉总阀"], ["换了一个什么？", "橡胶垫"], ["换完以后怎么样？", "不滴了"]], "h": "「橡胶垫」答成「小零件」也算对。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "34", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉顺序", "s": "客人来了，妈妈先请他坐沙发，再倒了一杯茶，最后端出一盘切好的苹果。", "qa": [["先请客人做什么？", "坐沙发"], ["倒了什么？", "一杯茶"], ["最后端出什么？", "一盘苹果"], ["苹果切好了吗？", "切好了"]], "h": "待客三步，是最实用的一张。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M26 46 V84 H74 V46\" fill=\"#FAC775\" stroke=\"#854F0B\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"43\" y=\"62\" width=\"14\" height=\"22\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.6\"/>\n<rect x=\"32\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n<rect x=\"57\" y=\"54\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"#854F0B\" stroke-width=\"2.4\"/>\n</svg>"}, {"no": "35", "t": "home", "tn": "我的家", "c": "#854F0B", "bg": "#FAEEDA", "l": 2, "ab": "听觉理解", "s": "今天停水了，一拧水龙头，一点水都没有。妈妈提着大水桶去楼下接水。", "qa": [["今天怎么了？", "停水了"], ["拧龙头有水吗？", "一点也没有"], ["妈妈用什么装水？", "大水桶"], ["去哪里接水？", "楼下"]], "h": "生活场景，孩子多半有经验。", "ic": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M18 48 L50 20 L82 48\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"3\" s
