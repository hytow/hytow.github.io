<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字趣 · 汉字合体与添笔</title>
<meta name="theme-color" content="#f6f1e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="字趣">
<meta name="description" content="两个汉字合体成新字，或给汉字添一笔变新字。手机也能玩的汉字小游戏，含字库图鉴。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b93b2b'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23fff8ee' font-family='serif'%3E字%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f6f1e6;
    --paper-2:#fffdf8;
    --ink:#201e1a;
    --ink-2:#4c4740;
    --muted:#8d857a;
    --line:rgba(32,30,26,.13);
    --line-2:rgba(32,30,26,.07);
    --red:#b93b2b;
    --red-soft:#f6e3de;
    --green:#2f6b58;
    --green-soft:#e4eee9;
    --gold:#b08c3f;
    --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --font-han:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun","Kaiti SC",serif;
    --shadow:0 12px 28px -20px rgba(62,45,20,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;min-height:100dvh;color:var(--ink);font-family:var(--font-ui);
    background:
      radial-gradient(1100px 620px at 18% -12%, #fffcf3 0%, rgba(255,252,243,0) 62%),
      radial-gradient(900px 520px at 92% 108%, #efe4cd 0%, rgba(239,228,205,0) 65%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.04) 0 1px, transparent 1px 4px);
  }
  .app{
    position:relative;z-index:1;max-width:520px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 18px);
    min-height:100dvh;display:flex;flex-direction:column;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  h1,h2,h3,p{margin:0}

  /* ---------- 通用 ---------- */
  .pill{
    font-size:12px;letter-spacing:.06em;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:rgba(255,253,248,.7);
  }
  .pill:active{transform:scale(.97)}
  .primary{
    width:100%;height:52px;border-radius:15px;background:var(--ink);color:#fdfaf2;
    font-size:16px;letter-spacing:.14em;font-weight:500;
    box-shadow:0 14px 26px -18px rgba(32,30,26,.9);
    transition:transform .12s ease,opacity .2s;
  }
  .primary:active{transform:translateY(1px) scale(.995)}
  .primary:disabled{opacity:.32;box-shadow:none}
  .ghost{
    width:100%;height:50px;border-radius:15px;border:1px solid var(--line);
    background:rgba(255,253,248,.6);font-size:15px;letter-spacing:.1em;color:var(--ink-2);
  }
  .ghost:active{background:rgba(255,253,248,.95)}
  .link{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

  /* ---------- 首页 ---------- */
  .hero{padding:14px 2px 22px;position:relative}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .kicker{font-size:11px;letter-spacing:.42em;color:var(--muted);padding-left:2px}
  .wordmark{
    font-family:var(--font-han);font-size:64px;line-height:1.12;font-weight:600;
    letter-spacing:.06em;margin:16px 0 8px;
  }
  .wordmark .mark{color:var(--red);margin-left:2px}
  .tagline{font-size:14px;color:var(--ink-2);letter-spacing:.04em;line-height:1.7}
  .seal{
    position:absolute;right:6px;bottom:24px;width:44px;height:44px;border:2px solid var(--red);
    border-radius:6px;color:var(--red);font-family:var(--font-han);font-size:15px;line-height:1.05;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transform:rotate(-7deg);opacity:.82;letter-spacing:0;padding:3px;
  }
  .modes{display:flex;flex-direction:column;gap:12px}
  .modes-label{font-size:11.5px;letter-spacing:.24em;color:var(--muted);margin:0 0 9px 3px}
  .mode{
    display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 14px;
    align-items:center;text-align:left;padding:15px 16px;border-radius:20px;
    background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow);
    transition:transform .14s ease, border-color .2s;
  }
  .mode:active{transform:scale(.985);border-color:rgba(185,59,43,.4)}
  .mode-demo{
    grid-row:1 / span 2;display:flex;align-items:center;gap:3px;
    font-family:var(--font-han);font-size:22px;color:var(--ink);
  }
  .mode-demo i{font-style:normal;font-size:11px;color:var(--muted);margin:0 2px}
  .mode-demo b{font-weight:400;font-size:11px;color:var(--muted);margin:0 2px}
  .mode-demo .ghost-c{color:var(--muted);opacity:.55}
  .mode-txt strong{display:block;font-size:17px;letter-spacing:.14em;font-weight:600}
  .mode-txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
  .mode-meta{font-size:11px;color:var(--muted);grid-column:2;letter-spacing:.08em}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .quick-btn{
    padding:13px 12px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,253,248,.55);text-align:left;font-size:14px;letter-spacing:.08em;
  }
  .quick-btn small{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
  .quick-btn:active{background:var(--paper-2)}
  .howto{margin-top:22px;border-top:1px solid var(--line-2);padding-top:14px;font-size:13px;color:var(--ink-2)}
  .howto summary{list-style:none;cursor:pointer;color:var(--muted);font-size:12.5px;letter-spacing:.12em}
  .howto summary::-webkit-details-marker{display:none}
  .howto summary::after{content:" ＋";color:var(--muted)}
  .howto[open] summary::after{content:" －"}
  .howto ul{margin:12px 0 0;padding-left:18px;line-height:1.85}
  .howto li::marker{color:var(--red)}
  .records{display:flex;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
  .records div{flex:1}
  .records div:nth-child(2){text-align:center}
  .records div:last-child{text-align:right}
  .records b{display:block;font-family:var(--font-han);font-size:19px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
  .records em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
  .foot{margin-top:auto;padding-top:20px;font-size:11px;color:var(--muted);letter-spacing:.06em;line-height:1.8}

  /* ---------- 顶栏 / 进度 ---------- */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;font-size:15px;color:var(--ink-2);background:rgba(255,253,248,.6);flex:0 0 auto;
  }
  .icon-btn:active{background:var(--paper-2)}
  .pbar{flex:1;height:4px;border-radius:99px;background:rgba(32,30,26,.09);overflow:hidden}
  .pbar span{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .topscore{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:0 0 auto;letter-spacing:.04em}
  .topscore b{font-size:16px}

  .qmeta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);letter-spacing:.12em;margin-bottom:2px;min-height:18px}
  .streak{color:var(--red);opacity:0;transition:opacity .25s}
  .streak.on{opacity:1}

  /* ---------- 题板 ---------- */
  .board{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 0 6px}
  .playbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .slot{display:flex;flex-direction:column;align-items:center;gap:9px}
  .frame{
    --sz:clamp(118px, 16.4vh, 148px);
    width:var(--sz);height:var(--sz);border-radius:22px;background:var(--paper-2);
    border:1px solid var(--line);box-shadow:var(--shadow), inset 0 1px 0 #fff;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;
    font-family:var(--font-han);
  }
  .frame::before{
    content:"";position:absolute;inset:9px;border-radius:15px;
    border:1px dashed rgba(32,30,26,.09);pointer-events:none;
  }
  .pair.lr{flex-direction:row;gap:7px}
  .pair.lr .g{font-size:calc(var(--sz) * .37);line-height:1}
  .pair.tb{flex-direction:column;justify-content:center;line-height:1;gap:3px}
  .pair.tb .g{font-size:calc(var(--sz) * .355);line-height:.95}
  .pair .stroke{
    position:absolute;top:-12px;right:-2px;
    padding:4px 9px 5px;border-radius:999px;
    background:var(--paper-2);border:1px solid rgba(185,59,43,.42);
    color:var(--red);font-size:16px;line-height:1;letter-spacing:.06em;
    box-shadow:0 6px 14px -10px rgba(90,40,25,.9);
    transform:rotate(4deg);animation:breathe 2.6s ease-in-out infinite;
  }
  .pair .g.big{font-size:calc(var(--sz) * .525)}
  .cap{font-size:14px;letter-spacing:.12em;color:var(--ink-2);font-weight:500}
  .eq{font-family:var(--font-han);font-size:20px;color:var(--muted);padding-bottom:22px}
  .frame.ans{border-style:dashed;border-color:rgba(32,30,26,.22);background:rgba(255,253,248,.5)}
  .frame.ans .qm{font-size:calc(var(--sz) * .34);color:rgba(32,30,26,.22)}
  .frame.ans.revealed{border-style:solid;background:var(--paper-2);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .frame.ans.revealed .g{font-size:calc(var(--sz) * .525);line-height:1;animation:inkIn .5s ease both}
  .frame.ans.revealed.ok{border-color:rgba(47,107,88,.5);box-shadow:0 0 0 4px rgba(47,107,88,.09), var(--shadow)}
  .frame.ans.revealed.no{border-color:rgba(185,59,43,.45);box-shadow:0 0 0 4px rgba(185,59,43,.08), var(--shadow);animation:shake .4s}
  .stamp{
    position:absolute;right:6px;bottom:8px;width:26px;height:26px;border:1.6px solid var(--red);
    border-radius:4px;color:var(--red);font-size:13px;display:grid;place-items:center;
    transform:rotate(-9deg);opacity:.9;font-family:var(--font-han);
    animation:stampIn .4s .18s cubic-bezier(.2,1.6,.4,1) both;
  }

  /* ---------- 选项 ---------- */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .opt{
    height:64px;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);
    box-shadow:0 8px 18px -16px rgba(62,45,20,.6);
    font-family:var(--font-han);font-size:32px;line-height:1;color:var(--ink);
    transition:transform .1s ease, background .18s, border-color .18s, opacity .18s;
    position:relative;
  }
  .opt:active{transform:scale(.975)}
  .opt.correct{background:var(--green-soft);border-color:rgba(47,107,88,.5);color:var(--green)}
  .opt.wrong{background:var(--red-soft);border-color:rgba(185,59,43,.45);color:var(--red)}
  .opt.out{opacity:.22;text-decoration:line-through;text-decoration-thickness:1px}
  .opt.reveal-ans{box-shadow:0 0 0 2px rgba(47,107,88,.35) inset}

  /* ---------- 反馈 ---------- */
  .fb-wrap{overflow:hidden;max-height:0;transition:max-height .38s cubic-bezier(.2,.8,.2,1)}
  .fb-wrap.show{max-height:200px}
  .fb{
    margin-top:14px;padding:13px 14px 14px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,253,248,.85);
  }
  .fb.ok{border-color:rgba(47,107,88,.25);background:rgba(228,238,233,.55)}
  .fb.no{border-color:rgba(185,59,43,.22);background:rgba(246,227,222,.5)}
  .fb-head{display:flex;align-items:baseline;gap:8px}
  .fb-ico{font-size:13px;font-weight:600}
  .fb.ok .fb-ico{color:var(--green)}
  .fb.no .fb-ico{color:var(--red)}
  .fb-char{font-family:var(--font-han);font-size:24px;line-height:1}
  .fb-py{font-size:12px;color:var(--muted);letter-spacing:.04em}
  .fb-pts{margin-left:auto;font-size:12.5px;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .fb p{font-size:13px;line-height:1.72;color:var(--ink-2);margin-top:7px;letter-spacing:.02em}
  .bottom{margin-top:16px}

  /* ---------- 结算 ---------- */
  .result{padding-top:8px;display:flex;flex-direction:column;align-items:center}
  .rank{
    margin-top:6px;padding:7px 16px;border:1.6px solid var(--red);border-radius:6px;color:var(--red);
    font-family:var(--font-han);font-size:20px;letter-spacing:.3em;text-indent:.3em;
    transform:rotate(-2.5deg);opacity:.92;
  }
  .score-big{font-family:var(--font-han);font-size:76px;line-height:1.1;margin:14px 0 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score-big small{font-size:16px;font-family:var(--font-ui);color:var(--muted);margin-left:6px;letter-spacing:.1em}
  .stats{display:flex;gap:26px;margin:14px 0 4px;text-align:center}
  .stats div{display:flex;flex-direction:column;gap:4px}
  .stats b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
  .stats em{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.1em}
  .verdict{font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:.06em}
  .wrongs{width:100%;margin-top:22px;border-top:1px solid var(--line-2);padding-top:14px}
  .wrongs h3{font-size:11.5px;color:var(--muted);letter-spacing:.16em;font-weight:400;margin-bottom:10px}
  .witem{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .witem:last-child{border-bottom:0}
  .wchar{font-family:var(--font-han);font-size:28px;line-height:1;color:var(--red);flex:0 0 auto;margin-top:2px}
  .wtxt b{display:block;font-size:12.5px;font-weight:500;letter-spacing:.04em}
  .wtxt span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6}
  .actions{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:22px}
  .perfect{font-size:12.5px;color:var(--green);margin-top:22px;letter-spacing:.1em}

  /* ---------- 图鉴 ---------- */
  .ghead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ghead h2{font-family:var(--font-han);font-size:22px;letter-spacing:.14em;font-weight:600;flex:1}
  .gsub{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
  .gfilter{display:flex;gap:8px;margin-bottom:12px}
  .chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;
    color:var(--ink-2);background:rgba(255,253,248,.55);letter-spacing:.08em;
  }
  .chip.active{background:var(--ink);color:#fdfaf2;border-color:var(--ink)}
  .gsearch{
    width:100%;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(255,253,248,.7);
    padding:0 14px;font-size:13.5px;color:var(--ink);margin-bottom:6px;font-family:var(--font-ui);
  }
  .gsearch::placeholder{color:rgba(141,133,122,.8);letter-spacing:.04em}
  .gsearch:focus{outline:none;border-color:rgba(32,30,26,.3)}
  .glist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .gcard{
    border:1px solid var(--line);border-radius:15px;background:rgba(255,253,248,.72);
    padding:10px 12px;overflow:hidden;
  }
  .gcard.hide{display:none}
  .gcard summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer}
  .gcard summary::-webkit-details-marker{display:none}
  .gchar{
    font-family:var(--font-han);font-size:30px;line-height:1;width:44px;height:44px;
    display:grid;place-items:center;border-radius:11px;background:#fff;border:1px solid var(--line-2);
    flex:0 0 auto;
  }
  .ginfo{flex:1;min-width:0}
  .ginfo b{display:block;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--ink-2)}
  .ginfo em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .gdot{width:6px;height:6px;border-radius:50%;background:rgba(32,30,26,.14);flex:0 0 auto}
  .gdot.on{background:var(--red)}
  .gchev{font-size:17px;line-height:1;color:rgba(32,30,26,.32);transform:rotate(90deg);transition:transform .22s;flex:0 0 auto}
  .gcard[open] .gchev{transform:rotate(-90deg)}
  .gcard p{font-size:12.5px;line-height:1.75;color:var(--ink-2);margin:10px 0 2px;padding-top:10px;border-top:1px dashed var(--line-2);letter-spacing:.02em}

  .empty{font-size:13px;color:var(--muted);padding:30px 0;text-align:center;letter-spacing:.08em}

  /* ---------- 动画 ---------- */
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes inkIn{0%{opacity:0;transform:scale(.55);filter:blur(4px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
  @keyframes stampIn{0%{opacity:0;transform:rotate(-9deg) scale(1.7)}100%{opacity:.9;transform:rotate(-9deg) scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  @keyframes breathe{0%,100%{opacity:.82;transform:rotate(4deg) scale(1)}50%{opacity:1;transform:rotate(4deg) scale(1.06)}}

  @media (max-width:360px){
    .app{padding-left:16px;padding-right:16px}
    .wordmark{font-size:56px}
    .frame{--sz:104px;border-radius:19px}
    .opt{font-size:28px;height:58px}
    .eq{font-size:17px}
    .stats{gap:18px}
    .score-big{font-size:64px}
  }
  @media (max-height:730px){
    .hero{padding:6px 2px 16px}
    .wordmark{font-size:54px;margin:10px 0 6px}
    .mode{padding:12px 14px}
    .quick{margin-top:10px}
    .howto{margin-top:16px;padding-top:12px}
    .records{margin-top:14px;padding-top:12px}
    .foot{padding-top:14px}
    .board{padding:12px 0 4px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
  'use strict';

  /* ================= 数据：合体 ================= */
  /* a+b -> ans；l = lr 左右 / tb 上下 */
  var COMBO = [
    {a:'木',b:'几',ans:'机',py:'jī',l:'lr',n:'木字旁配「几」：木头做出的机巧之物。'},
    {a:'几',b:'木',ans:'朵',py:'duǒ',l:'tb',n:'「几」在上，「木」在下，花枝上开出一朵。'},
    {a:'女',b:'子',ans:'好',py:'hǎo',l:'lr',n:'女与子，古人眼里最称心的组合。'},
    {a:'日',b:'月',ans:'明',py:'míng',l:'lr',n:'日与月，天上最亮的两样都在这儿。'},
    {a:'人',b:'木',ans:'休',py:'xiū',l:'lr',n:'人靠在树旁，就是休息。'},
    {a:'木',b:'木',ans:'林',py:'lín',l:'lr',n:'两棵树并排，长成一片林。'},
    {a:'口',b:'鸟',ans:'鸣',py:'míng',l:'lr',n:'鸟张开嘴，声音就出来了。'},
    {a:'田',b:'力',ans:'男',py:'nán',l:'tb',n:'在田里出力的人。'},

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){

      var t = a[i]; a[i] = a[j]; a[j] = t;

  }

  /* ================= 音效 ================= */
  var audioCtx = null;
  function tone(freq, dur, type, vol, delay){
    if (!save.sound) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }catch(e){}
  }
  function sfx(kind){
    if (kind === 'ok'){ tone(660,.16,'sine',.05); tone(990,.2,'sine',.04,.08); }
    else if (kind === 'no'){ tone(190,.22,'triangle',.055); tone(150,.22,'triangle',.04,.06); }
    else if (kind === 'tap'){ tone(520,.05,'sine',.025); }
    else if (kind === 'win'){ [523,659,784,1047].forEach(function(f,i){ tone(f,.24,'sine',.045,i*.09); }); }
  }

  function buildQueue(mode){
    var combo = shuffle(COMBO);
    var stroke = shuffle(STROKE);
    var items;
    if (mode === 'combo'){
      items = combo.slice(0, QUIZ_LEN);
    } else if (mode === 'stroke'){
      items = stroke.slice(0, QUIZ_LEN);
    } else {
      items = combo.slice(0, 6).concat(stroke.slice(0, 4));
    }
    return shuffle(items);
  }

  function pickOptions(q){
    var ans = q.ans;
    var ban = {};
    ban[ans] = 1;
    (q.ban || []).forEach(function(c){ ban[c] = 1; });
    if (q.base) ban[q.base] = 1;

    var primary = [];
    var secondary = [];

    if (q.kind === 'combo'){
      var key = [q.a, q.b].sort().join('|');
      COMBO.forEach(function(x){
        var k = [x.a, x.b].sort().join('|');
        if (k === key){ ban[x.ans] = 1; return; }   // 同部件的另一种组合，不能当干扰项
        if (x.a === q.a || x.a === q.b || x.b === q.a || x.b === q.b) primary.push(x.ans);
        else secondary.push(x.ans);
      });
    } else {
      // 添笔题只用笔画简单的字做干扰项，避免一眼就能排除
      STROKE.forEach(function(x){ if (x.ans !== ans) primary.push(x.ans); });
      SIMPLE.forEach(function(c){ secondary.push(c); });
      secondary = secondary.concat(STROKE.map(function(x){ return x.ans; }));
    }

    var seen = {};
    seen[ans] = 1;
    var out = [];

    function take(list){
      var sh = shuffle(list);
      for (var i = 0; i < sh.length && out.length < 3; i++){
        var c = sh[i];
        if (ban[c] || seen[c]) continue;
        seen[c] = 1; out.push(c);
      }
    }
    take(primary);
    take(secondary);
    take(FALLBACK);

    var guard = 0;
    while (out.length < 3 && guard++ < 300){
      var r = FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
      if (ban[r] || seen[r]) continue;
      seen[r] = 1; out.push(r);
    }
    return shuffle([ans].concat(out));
  }

    state.hint = false;
    state.answered = false;
    state.picked = '';
    state.gain = 0;
    renderQuestion();
  }

  function renderQuestion(){
    var q = state.queue[state.idx];
    state.q = q;
    state.answered = false;
    state.hint = false;
    state.options = pickOptions(q);

    var isCombo = q.kind === 'combo';
    var lr = isCombo && q.l === 'lr';
    var pairHTML, capHTML;

    if (isCombo){
      pairHTML = '<div class="frame pair ' + (lr ? 'lr' : 'tb') + '">' +
                   '<span class="g">' + q.a + '</span>' +
                   '<span class="g">' + q.b + '</span>' +
                 '</div>';
      capHTML = lr ? '左右相合' : '上下相叠';
    } else {
      pairHTML = '<div class="frame pair">' +
                   '<span class="g big">' + q.base + '</span>' +
                   '<span class="stroke">＋' + q.add + '</span>' +
                 '</div>';
      capHTML = '添一' + q.addName + '（' + q.add + '）';
    }

    var optsHTML = state.options.map(function(c){
      return '<button class="opt" data-act="pick" data-ch="' + c + '">' + c + '</button>';
    }).join('');

    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-act="quit" aria-label="返回">←</button>' +
        '<div class="pbar"><span id="pbar"></span></div>' +
        '<div class="topscore"><b id="scoreVal">' + state.score + '</b> 分</div>' +
      '</div>' +
      '<div class="qmeta">' +
        '<span>' + (q.kind === 'combo' ? '合体' : '添笔') + ' · 第 ' + (state.idx + 1) + ' / ' + state.queue.length + ' 题</span>' +
        '<span class="streak' + (state.streak >= 2 ? ' on' : '') + '" id="streak">连对 ×' + state.streak + '</span>' +
      '</div>' +

      '<div class="playbody">' +
      '<div class="board">' +
        '<div class="slot">' + pairHTML + '<div class="cap">' + capHTML + '</div></div>' +
        '<div class="eq">＝</div>' +
        '<div class="slot">' +
          '<div class="frame ans" id="ansFrame"><span class="qm">？</span></div>' +
          '<div class="cap" id="ansCap">会是什么字</div>' +
        '</div>' +
      '</div>' +

      '<div class="options">' + optsHTML + '</div>' +
      '<div class="fb-wrap" id="fbWrap" aria-live="polite"></div>' +
      '</div>' +

      '<div class="bottom">' +
        '<button class="ghost" id="hintBtn" data-act="hint">提示一下 · 去掉两个错误答案</button>' +
        '<button class="primary" data-act="next" style="display:none" id="nextBtn">继 续</button>' +
      '</div>';

    updateProgress();
  }

  function updateProgress(){
    var el = $('#pbar');
    if (!el) return;
    var pct = ((state.idx + 1) / state.queue.length) * 100;
    el.style.width = pct + '%';
  }

  function useHint(){
    if (state.answered || state.hint) return;
    state.hint = true;
    var wrongs = $$('.opt').filter(function(b){ return b.dataset.ch !== state.q.ans; });
    shuffle(wrongs).slice(0, 2).forEach(function(b){
      b.classList.add('out');
      b.disabled = true;
    });
    var hb = $('#hintBtn');
    if (hb){ hb.textContent = '提示已用 · 本题 -3 分'; hb.disabled = true; hb.style.opacity = '.45'; }
    sfx('tap');
  }

  function choose(ch){
    if (state.answered) return;
    state.answered = true;
    state.picked = ch;
    var q = state.q;
    var ok = ch === q.ans;
    var gain = 0;

    if (ok){
      state.streak++;
      state.correct++;
      if (state.streak > state.maxStreak) state.maxStreak = state.streak;
      gain = 10 + Math.min(Math.max(state.streak - 1, 0), 5) * 2;
      if (state.hint) gain -= 3;
      gain = Math.max(gain, 1);
      state.score += gain;
      state.gain = gain;
      if (save.learned.indexOf(q.id) === -1) save.learned.push(q.id);
      save.right++;
      sfx('ok');
    } else {
      state.streak = 0;
      state.wrong.push({ q: q, picked: ch });
      sfx('no');
    }
    save.total++;
    persist();

    if (ok && state.streak >= 3) tone(880,.12,'sine',.03,.16);

    // 选项状态
    $$('.opt').forEach(function(b){
      b.disabled = true;
      var c = b.dataset.ch;
      if (c === q.ans){
        b.classList.add('correct');
        if (c !== ch) b.classList.add('reveal-ans');
      } else if (c === ch){
        b.classList.add('wrong');
      }
    });

    // 答案框
    var frame = $('#ansFrame');
    frame.classList.add('revealed', ok ? 'ok' : 'no');
    frame.innerHTML = '<span class="g">' + q.ans + '</span>' + (ok ? '<span class="stamp">对</span>' : '');
    var cap = $('#ansCap');
    if (cap) cap.textContent = ok ? '就是它' : '正确答案';

    // 顶部分数与连对
    var sv = $('#scoreVal'); if (sv) sv.textContent = state.score;
    var st = $('#streak');
    if (st){
      st.textContent = '连对 ×' + state.streak;
      st.classList.toggle('on', state.streak >= 2);
    }

    // 反馈
    var fw = $('#fbWrap');
    fw.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '">' +
        '<div class="fb-head">' +
          '<span class="fb-ico">' + (ok ? '✓ 答对' : '✕ 答错') + '</span>' +
          '<span class="fb-char">' + q.ans + '</span>' +
          '<span class="fb-py">' + q.py + '</span>' +
          (ok ? '<span class="fb-pts">+' + gain + '</span>' : '') +
        '</div>' +
        '<p>' + q.n + '</p>' +
      '</div>';
    requestAnimationFrame(function(){ fw.classList.add('show'); });

    // 底部按钮
    var hb = $('#hintBtn');
    if (hb) hb.style.display = 'none';
    var nb = $('#nextBtn');
    if (nb){
      nb.style.display = 'block';
      nb.textContent = state.idx >= state.queue.length - 1 ? '看 成 绩' : '继 续';
    }
    updateProgress();
  }

  function next(){
    state.idx++;
    if (state.idx >= state.queue.length){ finish(); return; }
    renderQuestion();
  }

  /* ================= 结算 ================= */
  function rankOf(acc){
    if (acc >= 1) return '造字圣人';
    if (acc >= 0.9) return '拆字状元';
    if (acc >= 0.7) return '识字秀才';
    if (acc >= 0.5) return '蒙学童生';
    return '初学蒙童';
  }

  function finish(){
    state.screen = 'result';
    var len = state.queue.length;
    var acc = state.correct / len;
    var mode = state.mode;
    var prevBest = save.best[mode] || 0;
    var isNewBest = state.score > prevBest && prevBest > 0;
    if (state.score > (save.best[mode] || 0)) save.best[mode] = state.score;
    if (state.maxStreak > save.maxStreak) save.maxStreak = state.maxStreak;
    save.plays++;
    persist();
    if (acc >= 0.9) sfx('win'); else if (acc > 0) sfx('ok');

    var modeName = mode === 'combo' ? '合体' : (mode === 'stroke' ? '添笔' : '混合');

    var wrongHTML = '';
    if (state.wrong.length){
      wrongHTML = '<div class="wrongs"><h3>这几题再看一眼</h3>' +
        state.wrong.map(function(w){
          var q = w.q;
          var eq = q.kind === 'combo'
            ? q.a + ' ＋ ' + q.b + '（' + (q.l === 'lr' ? '左右' : '上下') + '）'
            : q.base + ' ＋ ' + q.add + '（' + q.addName + '）';
          return '<div class="witem">' +
              '<span class="wchar">' + q.ans + '</span>' +
              '<span class="wtxt"><b>' + eq + ' → ' + q.ans + ' ' + q.py + '</b><span>' + q.n + '</span></span>' +
            '</div>';
        }).join('') + '</div>';
    } else {
      wrongHTML = '<p class="perfect">全部答对，一个都没错。</p>';
    }

    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-act="home" aria-label="返回首页">←</button>' +
        '<div class="topscore">' + modeName + ' · ' + len + ' 题</div>' +
      '</div>' +
      '<div class="result">' +
        '<div class="rank">' + rankOf(acc) + '</div>' +
        '<div class="score-big">' + state.score + '<small>分</small></div>' +
        '<div class="stats">' +
          '<div><b>' + state.correct + '/' + len + '</b><em>答对</em></div>' +
          '<div><b>' + state.maxStreak + '</b><em>最长连对</em></div>' +
          '<div><b>' + save.best[mode] + '</b><em>历史最佳</em></div>' +
        '</div>' +
        '<div class="verdict">' + (isNewBest ? '刷新了个人最好成绩' : '正确率 ' + Math.round(acc * 100) + '%') + '</div>' +
        '<div class="actions">' +
          '<button class="primary" data-act="again">再 来 一 局</button>' +
          '<button class="ghost" data-act="gallery">翻翻字库图鉴</button>' +
          '<button class="ghost" data-act="home">回 到 首 页</button>' +
        '</div>' +
        wrongHTML +
      '</div>';
  }

  /* ================= 图鉴 ================= */
  function renderGallery(){
    state.screen = 'gallery';
    state.galFilter = 'all';
    state.galQuery = '';
    var learnedMap = {};
    save.learned.forEach(function(id){ learnedMap[id] = 1; });

    var all = COMBO.concat(STROKE);
    var cards = all.map(function(q){
      var isCombo = q.kind === 'combo';
      var eq = isCombo
        ? q.a + ' ＋ ' + q.b + '（' + (q.l === 'lr' ? '左右' : '上下') + '）'
        : q.base + ' ＋ 一笔 ' + q.add + '（' + q.addName + '）';
      var text = (q.ans + ' ' + q.py + ' ' + eq + ' ' + q.n).toLowerCase();
      return '<details class="gcard" data-kind="' + q.kind + '" data-t="' + text.replace(/"/g,'') + '">' +
          '<summary>' +
            '<span class="gchar">' + q.ans + '</span>' +
            '<span class="ginfo"><b>' + eq + '</b><em>' + q.py + '</em></span>' +
            '<span class="gdot' + (learnedMap[q.id] ? ' on' : '') + '"></span>' +
            '<span class="gchev">›</span>' +
          '</summary>' +
          '<p>' + q.n + '</p>' +
        '</details>';
    }).join('');

    app.innerHTML =
      '<div class="ghead">' +
        '<button class="icon-btn" data-act="home" aria-label="返回">←</button>' +
        '<div style="flex:1"><h2>字库图鉴</h2><div class="gsub">已识 ' + save.learned.length + ' / ' + TOTAL + ' 字 · 点开看字理</div></div>' +
      '</div>' +
      '<div class="gfilter">' +
        '<button class="chip active" data-act="filter" data-f="all">全部</button>' +
        '<button class="chip" data-act="filter" data-f="combo">合体 ' + COMBO.length + '</button>' +
        '<button class="chip" data-act="filter" data-f="stroke">添笔 ' + STROKE.length + '</button>' +
        '<button class="chip" data-act="filter" data-f="learned">已识</button>' +
      '</div>' +
      '<input class="gsearch" id="gsearch" type="search" placeholder="搜一个字、拼音或部件…" autocomplete="off">' +
      '<div class="glist" id="glist">' + cards + '</div>' +
      '<div class="empty" id="gempty" style="display:none">没有找到，换个字试试。</div>';

    applyGalleryFilter();
  }

  function applyGalleryFilter(){
    var q = (state.galQuery || '').trim().toLowerCase();
    var learnedMap = {};
    save.learned.forEach(function(id){ learnedMap[id] = 1; });
    var count = 0;
    $$('.gcard').forEach(function(card){
      var okKind = true;
      if (state.galFilter === 'combo' || state.galFilter === 'stroke') okKind = card.dataset.kind === state.galFilter;
      else if (state.galFilter === 'learned'){
        // 已识：卡片角标为红点
        var dot = card.querySelector('.gdot');
        okKind = !!(dot && dot.classList.contains('on'));
      }
      var okText = !q || card.dataset.t.indexOf(q) !== -1;
      var show = okKind && okText;
      card.classList.toggle('hide', !show);
      if (show) count++;
    });
    var em = $('#gempty');
    if (em) em.style.display = count ? 'none' : 'block';
  }

  /* ================= 事件 ================= */
  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;

    if (act === 'start'){ sfx('tap'); startRound(el.dataset.mode); return; }
    if (act === 'pick'){ choose(el.dataset.ch); return; }
    if (act === 'next'){ sfx('tap'); next(); return; }
    if (act === 'hint'){ useHint(); return; }
    if (act === 'quit'){ sfx('tap'); renderHome(); return; }
    if (act === 'home'){ sfx('tap'); renderHome(); return; }
    if (act === 'again'){ sfx('tap'); startRound(state.mode); return; }
    if (act === 'gallery'){ sfx('tap'); renderGallery(); return; }
    if (act === 'sound'){
      save.sound = !save.sound;
      persist();
      if (save.sound) tone(720,.1,'sine',.04);
      var label = el;
      label.textContent = '音效 ' + (save.sound ? '开' : '关');
      return;
    }
    if (act === 'filter'){
      state.galFilter = el.dataset.f;
      $$('.chip').forEach(function(c){ c.classList.toggle('active', c === el); });
      applyGalleryFilter();
      return;
    }
  });

  app.addEventListener('input', function(e){
    if (e.target && e.target.id === 'gsearch'){
      state.galQuery = e.target.value;
      applyGalleryFilter();
    }
  });

  document.addEventListener('keydown', function(e){
    if (state.screen !== 'play') return;
    if (e.key >= '1' && e.key <= '4'){
      var btns = $$('.opt');
      var b = btns[Number(e.key) - 1];
      if (b && !b.disabled) choose(b.dataset.ch);
    } else if (e.key === 'Enter' || e.key === ' '){
      var nb = $('#nextBtn');
      if (nb && nb.style.display !== 'none'){ e.preventDefault(); next(); }
    }
  });

  /* ================= 启动 ================= */
  renderHome();
})();
</script>
</body>
</html>
