<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的小站 · 三个小应用</title>
<meta name="theme-color" content="#f6f1e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b93b2b'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff8ee' font-family='serif'%3E站%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f6f1e6; --card:#fffdf8; --ink:#201e1a; --ink2:#4c4740;
    --muted:#8d857a; --line:rgba(32,30,26,.13); --red:#b93b2b;
    --han:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;color:var(--ink);font-family:var(--ui);
    background:radial-gradient(900px 520px at 20% -10%,#fffdf6 0%,rgba(255,253,246,0) 60%),var(--paper);
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 32px);
  }
  main{width:100%;max-width:460px}
  .kicker{font-size:11px;letter-spacing:.42em;color:var(--muted)}
  h1{font-family:var(--han);font-size:40px;line-height:1.2;letter-spacing:.06em;font-weight:600;margin:14px 0 8px}
  .sub{font-size:13.5px;color:var(--ink2);line-height:1.7;margin:0 0 26px}
  .list{display:flex;flex-direction:column;gap:11px}
  a.card{
    display:flex;align-items:center;gap:14px;padding:14px 15px;border-radius:18px;
    background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;
    box-shadow:0 12px 26px -22px rgba(62,45,20,.6);
    transition:transform .14s ease,border-color .2s;
  }
  a.card:active{transform:scale(.985);border-color:rgba(185,59,43,.4)}
  .glyph{
    width:46px;height:46px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
    font-family:var(--han);font-size:25px;line-height:1;background:#fff;border:1px solid rgba(32,30,26,.1);
  }
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:.1em}
  .txt em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
  .arrow{color:rgba(32,30,26,.28);font-size:18px;flex:0 0 auto}
  footer{margin-top:30px;padding-top:16px;border-top:1px solid rgba(32,30,26,.08);font-size:11px;color:var(--muted);letter-spacing:.06em;line-height:1.9}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  @media (max-width:360px){ h1{font-size:34px} }
</style>
</head>
<body>
<main>
  <div class="kicker">GITHUB PAGES</div>
  <h1>我的小站</h1>
  <p class="sub">三个自己用的小应用，手机打开也能用。<br>点进去就能玩，进度存在本机。</p>

  <nav class="list">
    <a class="card" href="./ziqu/">
      <span class="glyph">字</span>
      <span class="txt"><b>字趣</b><em>两个汉字合体，或给汉字添一笔</em></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="./auditory-cards/">
      <span class="glyph">听</span>
      <span class="txt"><b>听觉训练卡</b><em>听音辨词，随时练一组</em></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="./fruit-slot-8090/">
      <span class="glyph">果</span>
      <span class="txt"><b>花果水果机</b><em>8090 街机复刻，可装到桌面</em></span>
      <span class="arrow">›</span>
    </a>
  </nav>

  <footer>
    hytow.github.io · 托管在 GitHub Pages<br>
    源码在 <a href="https://github.com/hytow/hytow.github.io">github.com/hytow/hytow.github.io</a>
  </footer>
</main>
</body>
</html>
